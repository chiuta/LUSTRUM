<style>
:root{--bg:#06110f;--bg2:#0b1f1b;--fg:#e8fbf6;--mut:#9bb8b0;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.13);--a:#2dd4bf;--b:#8b5cf6;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--shadow:0 20px 60px rgba(0,0,0,.45)}
@media (prefers-color-scheme:light){:root{--bg:#f2fbf8;--bg2:#dff4ee;--fg:#0a1f1a;--mut:#3d5d55;--card:rgba(255,255,255,.78);--bd:rgba(0,0,0,.12);--a:#0d9488;--b:#6d28d9;--ok:#047857;--warn:#b45309;--bad:#be123c;--shadow:0 20px 60px rgba(13,148,136,.18)}}
html.hc{--bg:#000;--bg2:#000;--fg:#fff;--mut:#fff;--card:#000;--bd:#fff;--a:#ffe600;--b:#ffe600;--ok:#7CFF7C;--warn:#ffe600;--bad:#ff9a9a;--shadow:none}
*{box-sizing:border-box}
html{font-size:calc(100% * var(--z,1));scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;color:var(--fg);background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;overflow-x:hidden}
html.rf body{font-family:Verdana,Tahoma,"Trebuchet MS",sans-serif;letter-spacing:.02em}
html.sp body{line-height:1.95;word-spacing:.14em}
html.ul a{text-decoration:underline}
html.nm *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
a{color:inherit}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(60rem 40rem at 15% -10%,color-mix(in srgb,var(--a) 28%,transparent),transparent 60%),radial-gradient(50rem 36rem at 95% 10%,color-mix(in srgb,var(--b) 26%,transparent),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2))}
html.hc .bg{background:#000}
.wrap{max-width:68rem;margin:0 auto;padding:0 1.25rem}
@media (min-width:1000px){.wrap{padding:0 4.5rem}}
header.nav{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--bd)}
html.hc header.nav{background:#000}
.nav .in{display:flex;align-items:center;gap:1rem;height:3.6rem}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:800;letter-spacing:.14em;text-decoration:none}
.brand svg{width:2rem;height:2rem}
.links{display:none;gap:1.2rem;margin-left:auto}
.links a{text-decoration:none;color:var(--mut);font-size:.92rem}
.links a:hover{color:var(--fg)}
@media (min-width:760px){.links{display:flex}}
select.lang{margin-left:auto;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:.7rem;padding:.4rem .6rem;font:inherit;font-size:.9rem}
@media (min-width:760px){select.lang{margin-left:0}}
section{padding:4.5rem 0}
.badge{display:inline-flex;gap:.5rem;align-items:center;padding:.4rem .9rem;border:1px solid var(--bd);border-radius:99px;background:var(--card);font-size:.85rem;color:var(--mut)}
.badge i{width:.5rem;height:.5rem;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 .6rem transparent}100%{box-shadow:0 0 0 0 transparent}}
.hero{padding:3.5rem 0 3rem}
.hero .grid{display:grid;gap:3rem;align-items:center}
@media (min-width:900px){.hero .grid{grid-template-columns:1.15fr .85fr}}
h1{font-size:clamp(2.3rem,5.4vw,3.7rem);line-height:1.04;margin:1.1rem 0 1rem;letter-spacing:-.03em}
.grad{background:linear-gradient(100deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
html.hc .grad{color:var(--a);background:none}
.lead{font-size:1.15rem;color:var(--mut);max-width:38rem}
.cta{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.8rem}
.btn{display:inline-flex;align-items:center;gap:.6rem;padding:.9rem 1.5rem;border-radius:.9rem;font-weight:700;text-decoration:none;border:1px solid var(--bd);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.pri{background:linear-gradient(100deg,var(--a),var(--b));color:#041310;border:0;box-shadow:0 10px 30px color-mix(in srgb,var(--a) 35%,transparent)}
html.hc .btn.pri{background:var(--a);color:#000}
.btn.sec{background:var(--card);color:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-top:2.6rem;max-width:34rem}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat b{display:block;font-size:2rem;line-height:1.1}
.stat span{font-size:.8rem;color:var(--mut)}
/* phone */
.phone-wrap{display:flex;justify-content:center;perspective:60rem}
.phone{width:16.5rem;aspect-ratio:9/19;border-radius:2.4rem;padding:.55rem;background:linear-gradient(160deg,#2b3a37,#0c1513);box-shadow:var(--shadow),inset 0 0 0 2px rgba(255,255,255,.08);animation:float 6s ease-in-out infinite;transform:rotateY(-8deg) rotateX(3deg)}
@keyframes float{50%{transform:rotateY(-8deg) rotateX(3deg) translateY(-.8rem)}}
.screen{height:100%;border-radius:1.9rem;background:linear-gradient(180deg,#0b1f1b,#06110f);color:#e8fbf6;padding:1.1rem .95rem;display:flex;flex-direction:column;gap:.7rem;overflow:hidden;position:relative}
.screen:before{content:"";position:absolute;top:.4rem;left:50%;width:4.2rem;height:.9rem;border-radius:99px;background:#000;transform:translateX(-50%)}
.mt{margin-top:.8rem;font-weight:800;letter-spacing:.2em;font-size:.8rem;text-align:center;color:#2dd4bf}
.ring{position:relative;width:9rem;height:9rem;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .trk{stroke:rgba(255,255,255,.1)}
.ring .val{stroke:url(#g);stroke-dasharray:352;stroke-dashoffset:352;transition:stroke-dashoffset 2.2s cubic-bezier(.2,.8,.2,1)}
.ring .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .ctr b{font-size:1.5rem;line-height:1}
.ring .ctr small{font-size:.65rem;color:#9bb8b0}
.cat{display:grid;grid-template-columns:4.4rem 1fr;gap:.6rem;align-items:center;font-size:.72rem;color:#9bb8b0;margin:.42rem 0}
.cat i{display:block;height:.55rem;border-radius:9px;background:linear-gradient(90deg,#2dd4bf,#8b5cf6);width:0;transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.freed{margin-top:auto;padding:.7rem;border-radius:.9rem;background:rgba(45,212,191,.14);border:1px solid rgba(45,212,191,.35);text-align:center;font-size:.72rem}
.freed b{display:block;font-size:1.2rem;color:#2dd4bf}
/* cards */
h2{font-size:clamp(1.7rem,4vw,2.6rem);margin:0 0 .6rem;letter-spacing:-.02em}
.sub2{color:var(--mut);max-width:40rem;margin:0 0 2.2rem}
.cards{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(15.5rem,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:1.2rem;padding:1.3rem;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-4px);border-color:var(--a)}
.card .ic{width:2.6rem;height:2.6rem;display:grid;place-items:center;border-radius:.8rem;background:linear-gradient(135deg,color-mix(in srgb,var(--a) 30%,transparent),color-mix(in srgb,var(--b) 30%,transparent));font-size:1.3rem;margin-bottom:.8rem}
.card h3{margin:.1rem 0 .35rem;font-size:1.05rem}
.card p{margin:0;color:var(--mut);font-size:.93rem}
.split{display:grid;gap:2rem;align-items:start}
@media (min-width:860px){.split{grid-template-columns:1fr 1fr}}
.pts{list-style:none;padding:0;margin:0;display:grid;gap:.8rem}
.pts li{display:flex;gap:.8rem;padding:1rem;border:1px solid var(--bd);border-radius:1rem;background:var(--card)}
.pts li:before{content:"✓";flex:none;width:1.6rem;height:1.6rem;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#04130e;font-weight:800;font-size:.85rem}
.shield{display:grid;place-items:center;min-height:15rem;border-radius:1.6rem;border:1px solid var(--bd);background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--a) 22%,transparent),transparent 65%),var(--card);text-align:center;padding:1.5rem}
.shield b{font-size:clamp(3rem,8vw,5rem);line-height:1}
.shield span{display:block;color:var(--mut);margin-top:.5rem}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:1.2rem;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:42rem;font-size:.92rem}
th,td{padding:.75rem .9rem;text-align:center;border-bottom:1px solid var(--bd)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px)}
html.hc th:first-child,html.hc td:first-child{background:#000}
thead th{font-size:.78rem;color:var(--mut);font-weight:600}
th.me,td.me{background:color-mix(in srgb,var(--a) 14%,transparent)}
th.me{color:var(--a);font-weight:800}
tr:last-child td{border-bottom:0}
.y{color:var(--ok);font-weight:800}.p{color:var(--warn);font-weight:800}.n{color:var(--bad);font-weight:800}.x{color:var(--mut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.legend{color:var(--mut);font-size:.85rem;margin-top:.8rem}
.not{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))}
.not .card:before{content:"—";display:block;font-size:1.6rem;font-weight:800;color:var(--bad);margin-bottom:.3rem}
.steps{counter-reset:s;display:grid;gap:.9rem;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:1rem;align-items:flex-start;padding:1rem 1.1rem;border:1px solid var(--bd);border-radius:1rem;background:var(--card)}
.steps li:before{content:counter(s);flex:none;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--a),var(--b));color:#041310}
.perm{display:grid;gap:.7rem;margin-top:2rem}
.perm div{padding:.9rem 1.1rem;border:1px solid var(--bd);border-radius:1rem;background:var(--card)}
.perm b{display:block}.perm span{color:var(--mut);font-size:.92rem}
footer{border-top:1px solid var(--bd);padding:2.2rem 0 6rem;color:var(--mut);font-size:.92rem}
.foot{display:grid;gap:1.4rem}
@media (min-width:760px){.foot{grid-template-columns:1fr auto;align-items:center}}
.share-row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.sh{width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--bd);background:var(--card);text-decoration:none;font-weight:800;font-size:.8rem;color:var(--fg);cursor:pointer;font-family:inherit}
.sh:hover{border-color:var(--a);color:var(--a)}
.bmc{display:inline-flex;gap:.5rem;align-items:center;padding:.6rem 1.1rem;border-radius:.8rem;background:#ffdd00;color:#201a00;font-weight:800;text-decoration:none}
html.hc .bmc{background:#ffe600;color:#000;border:2px solid #fff}
/* rails and floating controls (outside content gutters) */
.rail{position:fixed;top:50%;transform:translateY(-50%);z-index:40;display:none;flex-direction:column;gap:.5rem}
.rail.l{left:.9rem}.rail.r{right:.9rem}
@media (min-width:1000px){.rail{display:flex}}
.rb{width:2.6rem;height:2.6rem;border-radius:50%;border:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--fg);display:grid;place-items:center;font:700 1rem/1 inherit;cursor:pointer;text-decoration:none}
html.hc .rb{background:#000}
.rb:hover,.rb:focus-visible{border-color:var(--a);color:var(--a)}
#up{position:fixed;right:1rem;bottom:1rem;z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
#up.on{opacity:1;pointer-events:auto}
#aa{position:fixed;left:1rem;bottom:1rem;z-index:41}
#panel{position:fixed;left:1rem;bottom:4.2rem;z-index:41;width:min(18rem,calc(100vw - 2rem));padding:1rem;border-radius:1.1rem;border:1px solid var(--bd);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);display:none}
html.hc #panel{background:#000}
#panel.on{display:block}
#panel h4{margin:0 0 .6rem}
.opt{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.45rem 0;font-size:.92rem}
.sw{appearance:none;width:2.6rem;height:1.5rem;border-radius:99px;border:1px solid var(--bd);background:var(--card);position:relative;cursor:pointer;flex:none}
.sw:after{content:"";position:absolute;top:.15rem;left:.15rem;width:1.05rem;height:1.05rem;border-radius:50%;background:var(--mut);transition:transform .2s}
.sw:checked{background:var(--a)}.sw:checked:after{transform:translateX(1.1rem);background:#041310}
.pr{display:flex;gap:.5rem;margin-top:.6rem}
.pr button{flex:1;padding:.5rem;border-radius:.7rem;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.reveal{opacity:0;transform:translateY(1.4rem);transition:opacity .7s,transform .7s}
.reveal.in{opacity:1;transform:none}
</style>
</head>

nt, analisi, pubblicità o richieste di pagamento.","Ogni eliminazione è confermata; per i contenuti multimediali interviene la finestra di dialogo di Android.","Controlli di sicurezza integrati: le Motion Photo e le foto HDR non vengono mai ricompresse, i file modificati nelle ultime 24 ore non sono mai considerati inutili e nulla fuori dall'archiviazione condivisa può essere eliminato."],"c_title":"Il confronto","c_sub":"Con i pulitori più noti, in base alle loro descrizioni pubbliche (novembre 2026).","rows":["Senza pubblicità","Senza accesso a internet né telemetria","Open source","Duplicati e foto simili","Residui di app disinstallate","Compressione foto","Pulizia programmata","«Boost RAM»","Supporto root / Shizuku"],"legend":"✓ sì · ~ parziale o a pagamento · ✗ no · — assente, di proposito","sr":["sì","parziale o a pagamento","no","assente"],"n_title":"Cosa non fa — di proposito","n_items":["Il «boost RAM» e i chiusori di app in background. Android gestisce da solo la memoria; questi pulsanti non servono e scaricano la batteria.","Svuotare la cache delle altre app con un tocco. Android lo vieta senza privilegi speciali, perciò LUSTRUM ti porta direttamente alla schermata di archiviazione di ogni app.","iOS. Il sistema non consente pulizie fuori dall'area riservata dell'app.","L'annullamento. Non ci sono ancora cestino né anteprime: le eliminazioni sono definitive, quindi ogni azione viene prima confermata.","Guardare nella cartella Android/data delle altre app. Da Android 11 è bloccato per ogni app normale; solo root o Shizuku possono, e LUSTRUM non li supporta ancora."],"d_title":"Ottieni LUSTRUM","d_sub":"Beta — versione 0.4.0. Si installa direttamente, senza account di uno store.","steps":["Scarica l'APK dall'ultima versione pubblicata.","Consenti l'installazione da questa fonte quando Android lo chiede.","Apri LUSTRUM, concedi l'accesso ai contenuti multimediali e tocca Scansiona. Un accesso extra facoltativo sblocca documenti, residui e compressione."],"d_btn":"Scarica l'APK","perm_title":"I permessi, in parole semplici","perm_cols":["Permesso","Perché"],"perms":[["Contenuti multimediali","Analizza foto, video e audio. Per eliminare, Android chiede conferma."],["Accesso a tutti i file (facoltativo)","Documenti, file inutili, residui, cartelle vuote e compressione."],["Accesso ai dati di utilizzo (facoltativo)","Dimensione della cache per app e data dell'ultimo utilizzo."],["Rimozione pacchetti","Consente di disinstallare un'app dall'elenco."]],"lic":"Rilasciato con licenza MIT.","share":"Condividi","a11y":["Accessibilità","Contrasto elevato","Carattere leggibile","Più spaziatura","Riduci animazioni","Sottolinea i link","Ripristina","Chiudi"],"scroll":"Torna su","zoom":["Ingrandisci","Riduci","Adatta allo schermo"],"mock":["Usato","libero","Si può liberare","liberati"],"cats":["Immagini","Video","Audio","Documenti","Archivi"],"support":["Sostieni il progetto","Offrimi un caffè"],"build_title":"Compilazione","build_text":"JDK 21, Android SDK, Gradle 8.14+: esegui `gradle assembleRelease` (`gradle testDebugUnitTest` esegue i test unitari). L'APK compare in `app/build/outputs/apk/release/`. Il workflow Build APK testa, compila e pubblica una release per ogni nuova versione su main. Gli APK sono firmati con una chiave pubblica stabile nel repository (`tools/lustrum-public.jks`), quindi gli aggiornamenti si installano sopra; per una tua distribuzione aggiungi la tua chiave come secret del repository (`LUSTRUM_KEYSTORE_B64`, `LUSTRUM_STORE_PASS`, `LUSTRUM_KEY_PASS`, `LUSTRUM_KEY_ALIAS`).","status_title":"Stato","status_text":"Beta. 8 test unitari e la compilazione girano in CI; non ancora provata su un telefono fisico. Aggiornando da 0.3.0 o precedenti: disinstalla una volta, perché quelle versioni usavano un'altra chiave di firma; da 0.4.0 gli aggiornamenti si installano sopra.","ver":"Versione","upd":"Ultimo aggiornamento"},"es":{"name":"Español","title":"LUSTRUM — Limpiador de almacenamiento para Android. Sin anuncios. Sin internet.","meta":"LUSTRUM encuentra archivos basura, duplicados, fotos parecidas y restos de apps en tu teléfono Android. Código abierto, sin anuncios y sin posibilidad de conectarse a internet.","badge":"Código abierto · Sin anuncios · Sin conexión por diseño","h1a":"Recupera tu teléfono.","h1b":"Nada sale de él.","sub":"LUSTRUM encuentra archivos basura, duplicados, fotos parecidas y restos de aplicaciones, y los elimina solo con tu permiso. No tiene el permiso INTERNET, así que no puede enviar nada a ningún sitio.","cta1":"Descargar APK","cta2":"Código fuente","stats":["anuncios","permiso INTERNET","rastreadores","idiomas"],"nav":["Funciones","Comparación","Privacidad","Descargar"],"f_title":"Qué hace","features":[["El almacenamiento de un vistazo","Espacio usado y libre, desglosado en imágenes, vídeo, audio, documentos y archivos comprimidos."],["Archivos grandes, antiguos y basura","Archivos de más de 50 MB, sin tocar desde hace un año, temporales, miniaturas, papelera y descargas interrumpidas."],["Duplicados exactos","Comparados por tamaño, luego huella rápida y después SHA-256 completo. Por defecto se conserva la copia más antigua."],["Fotos parecidas","El hash perceptual encuentra fotos redimensionadas, guardadas de nuevo o repetidas, agrupadas sin encadenar. Revisas cada grupo; por defecto se conserva la copia más grande."],["Restos de aplicaciones","Carpetas que dejaron apps desinstaladas hace tiempo, y carpetas vacías."],["Compresión de fotos","Recodifica los JPEG grandes y los sustituye solo si el resultado pesa al menos un 20 % menos. Se conserva el EXIF; las Motion Photos y las fotos HDR se omiten."],["Apps, cachés y sin uso","Tamaño de la caché por app, fecha del último uso y acceso directo a sus ajustes o a la desinstalación."],["Estado del dispositivo","RAM, nivel y temperatura de la batería — solo lectura, a título informativo."]],"p_title":"Privado por diseño","p_text":"La mayoría de los limpiadores viven de anuncios y datos. LUSTRUM está hecho al revés.","points":["Sin permiso INTERNET en el manifiesto — puedes comprobarlo en la información de la app del sistema.","Sin cuentas, analíticas, anuncios ni avisos de pago.","Cada borrado se confirma; en los archivos multimedia lo hace el cuadro de diálogo del propio Android.","Comprobaciones de seguridad integradas: las Motion Photos y las fotos HDR nunca se recomprimen, los archivos modificados en las últimas 24 horas nunca se consideran basura y no se puede borrar nada fuera del almacenamiento compartido."],"c_title":"Cómo se compara","c_sub":"Frente a los limpiadores más conocidos, según sus descripciones públicas (noviembre de 2026).","rows":["Sin anuncios","Sin acceso a internet ni telemetría","Código abierto","Duplicados y fotos parecidas","Restos de apps desinstaladas","Compresión de fotos","Limpieza programada","«Boost de RAM»","Soporte root / Shizuku"],"legend":"✓ sí · ~ parcial o de pago · ✗ no · — no lo ofrece, a propósito","sr":["sí","parcial o de pago","no","no lo ofrece"],"n_title":"Lo que no hace — a propósito","n_items":["El «boost de RAM» y los cierra-apps en segundo plano. Android gestiona la memoria por sí solo; esos botones no ayudan y gastan batería.","Vaciar la caché de otras apps con un toque. Android lo prohíbe sin privilegios especiales, así que LUSTRUM te lleva directo a la pantalla de almacenamiento de cada app.","iOS. El sistema no permite limpiar fuera del espacio propio de la app.","Deshacer. Todavía no hay papelera ni vista previa: las eliminaciones son definitivas, por eso cada acción se confirma antes.","Mirar dentro de la carpeta Android/data de otras apps. Android 11+ lo bloquea a cualquier app normal; solo root o Shizuku pueden, y LUSTRUM aún no los admite."],"d_title":"Consigue LUSTRUM","d_sub":"Beta — versión 0.4.0. Se instala directamente, sin cuenta de tienda.","steps":["Descarga el APK de la última versión publicada.","Permite la instalación desde esta fuente cuando Android te lo pida.","Abre LUSTRUM, concede el acceso a multimedia y pulsa Escanear. Un acceso adicional opcional desbloquea documentos, restos y compresión."],"d_btn":"Descargar APK","perm_title":"Los permisos, en cristiano","perm_cols":["Permiso","Para qué"],"perms":[["Multimedia","Escanea fotos, vídeo y audio. Para borrar, Android pide confirmación."],["Acceso a todos los archivos (opcional)","Documentos, basura, restos, carpetas vacías y compresión."],["Acceso al uso de aplicaciones (opcional)","Tamaño de la caché por app y cuándo se usó por última vez."],["Eliminación de paquetes","Permite desinstalar una app desde la lista."]],"lic":"Publicado bajo licencia MIT.","share":"Compartir","a11y":["Accesibilidad","Alto contraste","Fuente legible","Más espaciado","Reducir animaciones","Subrayar enlaces","Restablecer","Cerrar"],"scroll":"Volver arriba","zoom":["Acercar","Alejar","Ajustar a la pantalla"],"mock":["Usado","libre","Se puede liberar","liberados"],"cats":["Imágenes","Vídeo","Audio","Documentos","Comprimidos"],"support":["Apoya el proyecto","Invítame a un café"],"build_title":"Compilación","build_text":"JDK 21, SDK de Android, Gradle 8.14+: ejecuta `gradle assembleRelease` (`gradle testDebugUnitTest` ejecuta las pruebas unitarias). El APK aparece en `app/build/outputs/apk/release/`. El flujo Build APK prueba, compila y publica una versión por cada versión nueva en main. Los APK se firman con una clave pública estable del repositorio (`tools/lustrum-public.jks`), así las actualizaciones se instalan encima; para tu propia distribución añade tu clave como secretos del repositorio (`LUSTRUM_KEYSTORE_B64`, `LUSTRUM_STORE_PASS`, `LUSTRUM_KEY_PASS`, `LUSTRUM_KEY_ALIAS`).","status_title":"Estado","status_text":"Beta. 8 pruebas unitarias y la compilación corren en CI; aún sin probar en un teléfono físico. Al actualizar desde 0.3.0 o anterior: desinstala una vez, porque esas versiones usaban otra clave de firma; desde 0.4.0 las actualizaciones se instalan encima.","ver":"Versión","upd":"Última actualización"},"pt":{"name":"Português","title":"LUSTRUM — Limpador de armazenamento para Android. Sem anúncios. Sem internet.","meta":"O LUSTRUM encontra arquivos inúteis, duplicatas, fotos parecidas e sobras de aplicativos no seu celular Android. Código aberto, sem anúncios e sem capacidade de se conectar à internet.","badge":"Código aberto · Sem anúncios · Offline por projeto","h1a":"Recupere seu celular.","h1b":"Nada sai dele.","sub":"O LUSTRUM encontra arquivos inúteis, duplicatas, fotos parecidas e sobras de aplicativos, e só os apaga com a sua autorização. Ele não tem a permissão INTERNET, então não consegue enviar nada para lugar nenhum.","cta1":"Baixar APK","cta2":"Código-fonte","stats":["anúncios","permissão INTERNET","rastreadores","idiomas"],"nav":["Funções","Comparação","Privacidade","Baixar"],"f_title":"O que faz","features":[["Armazenamento num relance","Espaço usado e livre, dividido em imagens, vídeo, áudio, documentos e arquivos compactados."],["Arquivos grandes, antigos e inúteis","Arquivos acima de 50 MB, parados há um ano, temporários, miniaturas, lixeira e downloads interrompidos."],["Duplicatas exatas","Comparadas por tamanho, depois impressão rápida e depois SHA-256 completo. Por padrão, a cópia mais antiga é mantida."],["Fotos parecidas","O hash perceptual encontra fotos redimensionadas, salvas de novo ou repetidas, agrupadas sem encadeamento. Você revisa cada grupo; por padrão a maior cópia é mantida."],["Sobras de aplicativos","Pastas deixadas por aplicativos desinstalados há muito tempo, além de pastas vazias."],["Compressão de fotos","Recodifica JPEGs grandes e só os substitui se o resultado for pelo menos 20% menor. O EXIF é mantido; Motion Photos e fotos HDR são ignoradas."],["Apps, caches e sem uso","Tamanho do cache por app, data do último uso e acesso direto às configurações ou à desinstalação."],["Estado do dispositivo","RAM, nível e temperatura da bateria — somente leitura, apenas informativo."]],"p_title":"Privado por construção","p_text":"A maioria dos limpadores vive de anúncios e dados. O LUSTRUM foi feito ao contrário.","points":["Sem a permissão INTERNET no manifesto — você confere nas informações do app no sistema.","Sem contas, análises, anúncios ou pedidos de pagamento.","Toda exclusão é confirmada; nas mídias, quem confirma é a caixa de diálogo do próprio Android.","Verificações de segurança integradas: Motion Photos e fotos HDR nunca são recomprimidas, arquivos alterados nas últimas 24 horas nunca são tratados como lixo e nada fora do armazenamento compartilhado pode ser excluído."],"c_title":"Como se compara","c_sub":"Com os limpadores mais conhecidos, com base nas descrições públicas deles (novembro de 2026).","rows":["Sem anúncios","Sem acesso à internet nem telemetria","Código aberto","Duplicatas e fotos parecidas","Sobras de apps desinstalados","Compressão de fotos","Limpeza agendada","“Turbo de RAM”","Suporte a root / Shizuku"],"legend":"✓ sim · ~ parcial ou pago · ✗ não · — não oferece, de propósito","sr":["sim","parcial ou pago","não","não oferece"],"n_title":"O que ele não faz — de propósito","n_items":["“Turbo de RAM” e fechadores de apps em segundo plano. O Android gerencia a memória sozinho; esses botões não ajudam e gastam bateria.","Limpar o cache de outros apps com um toque. O Android proíbe isso sem privilégios especiais, então o LUSTRUM leva você direto à tela de armazenamento de cada app.","iOS. O sistema não permite limpeza fora do espaço do próprio app.","Desfazer. Ainda não há lixeira nem pré-visualização: as exclusões são definitivas, por isso cada ação é confirmada antes.","Olhar dentro da pasta Android/data de outros apps. O Android 11+ bloqueia isso para qualquer app comum; só root ou Shizuku conseguem, e o LUSTRUM ainda não os suporta."],"d_title":"Baixe o LUSTRUM","d_sub":"Beta — versão 0.4.0. Instalação direta, sem conta de loja.","steps":["Baixe o APK na última versão publicada.","Permita a instalação desta fonte quando o Android perguntar.","Abra o LUSTRUM, conceda acesso às mídias e toque em Verificar. Um acesso extra opcional libera documentos, sobras e compressão."],"d_btn":"Baixar APK","perm_title":"As permissões, em palavras simples","perm_cols":["Permissão","Para quê"],"perms":[["Mídia","Verifica fotos, vídeo e áudio. Para apagar, o Android pede confirmação."],["Acesso a todos os arquivos (opcional)","Documentos, lixo, sobras, pastas vazias e compressão."],["Acesso ao uso de apps (opcional)","Tamanho do cache por app e quando foi usado pela última vez."],["Remoção de pacotes","Permite desinstalar um app pela lista."]],"lic":"Publicado sob a licença MIT.","share":"Compartilhar","a11y":["Acessibilidade","Alto contraste","Fonte legível","Mais espaçamento","Reduzir animações","Sublinhar links","Redefinir","Fechar"],"scroll":"Voltar ao topo","zoom":["Ampliar","Reduzir","Ajustar à tela"],"mock":["Usado","livre","Pode ser liberado","liberados"],"cats":["Imagens","Vídeo","Áudio","Documentos","Compactados"],"support":["Apoie o projeto","Me pague um café"],"build_title":"Compilação","build_text":"JDK 21, Android SDK, Gradle 8.14+: execute `gradle assembleRelease` (`gradle testDebugUnitTest` roda os testes unitários). O APK aparece em `app/build/outputs/apk/release/`. O workflow Build APK testa, compila e publica uma versão a cada nova versão enviada para main. Os APKs são assinados com uma chave pública estável do repositório (`tools/lustrum-public.jks`), então as atualizações se instalam por cima; para sua própria distribuição, adicione sua chave como segredos do repositório (`LUSTRUM_KEYSTORE_B64`, `LUSTRUM_STORE_PASS`, `LUSTRUM_KEY_PASS`, `LUSTRUM_KEY_ALIAS`).","status_title":"Situação","status_text":"Beta. 8 testes unitários e a compilação rodam no CI; ainda não testado em um celular físico. Ao atualizar da 0.3.0 ou anterior: desinstale uma vez, pois essas versões usavam outra chave de assinatura; a partir da 0.4.0 as atualizações se instalam por cima.","ver":"Versão","upd":"Última atualização"},"de":{"name":"Deutsch","title":"LUSTRUM — Speicherbereiniger für Android. Werbefrei. Ohne Internet.","meta":"LUSTRUM findet Datenmüll, Duplikate, ähnliche Fotos und App-Reste auf Ihrem Android-Handy. Open Source, werbefrei und ohne die Möglichkeit, online zu gehen.","badge":"Open Source · Werbefrei · Offline per Design","h1a":"Holen Sie sich Ihr Handy zurück.","h1b":"Nichts verlässt es.","sub":"LUSTRUM findet Datenmüll, Duplikate, ähnliche Fotos und App-Reste und löscht sie nur mit Ihrer Zustimmung. Es hat keine INTERNET-Berechtigung und kann daher nichts irgendwohin senden.","cta1":"APK herunterladen","cta2":"Quellcode","stats":["Werbung","INTERNET-Berechtigung","Tracker","Sprachen"],"nav":["Funktionen","Vergleich","Datenschutz","Download"],"f_title":"Was es kann","features":[["Speicher auf einen Blick","Belegter und freier Platz, aufgeteilt in Bilder, Videos, Audio, Dokumente und Archive."],["Große, alte und überflüssige Dateien","Dateien über 50 MB, seit einem Jahr unberührt, temporäre Dateien, Vorschaubilder, Papierkorb und abgebrochene Downloads."],["Exakte Duplikate","Verglichen nach Größe, dann schnellem Fingerabdruck, dann vollständigem SHA-256. Standardmäßig bleibt die älteste Kopie."],["Ähnliche Fotos","Wahrnehmungs-Hashing findet verkleinerte, neu gespeicherte und wiederholte Aufnahmen, ohne Kettenbildung gruppiert. Sie prüfen jede Gruppe; standardmäßig bleibt die größte Kopie erhalten."],["App-Reste","Ordner, die längst deinstallierte Apps hinterlassen haben, sowie leere Ordner."],["Foto-Komprimierung","Kodiert große JPEGs neu und ersetzt sie nur, wenn das Ergebnis mindestens 20 % kleiner ist. EXIF bleibt erhalten; Motion Photos und HDR-Aufnahmen werden übersprungen."],["Apps, Caches und Ungenutztes","Cache-Größe pro App, Datum der letzten Nutzung, direkt zu den Einstellungen oder zur Deinstallation."],["Gerätestatus","RAM, Akkustand und Temperatur — nur lesend, zur Information."]],"p_title":"Privat von Grund auf","p_text":"Die meisten Reiniger leben von Werbung und Daten. LUSTRUM ist umgekehrt gebaut.","points":["Keine INTERNET-Berechtigung im Manifest — prüfbar in den App-Infos des Systems.","Keine Konten, keine Analyse, keine Werbung, keine Kaufaufforderungen.","Jedes Löschen wird bestätigt; bei Mediendateien übernimmt das den Systemdialog von Android.","Eingebaute Sicherheitsprüfungen: Motion Photos und HDR-Fotos werden nie neu komprimiert, in den letzten 24 Stunden geänderte Dateien gelten nie als Datenmüll, und außerhalb des gemeinsamen Speichers lässt sich nichts löschen."],"c_title":"Der Vergleich","c_sub":"Mit den bekanntesten Reinigern, nach deren öffentlichen Beschreibungen (November 2026).","rows":["Werbefrei","Kein Internetzugriff, keine Telemetrie","Open Source","Duplikate und ähnliche Fotos","Reste deinstallierter Apps","Foto-Komprimierung","Geplante Reinigung","„RAM-Boost“","Root-/Shizuku-Unterstützung"],"legend":"✓ ja · ~ teilweise oder kostenpflichtig · ✗ nein · — bewusst nicht vorhanden","sr":["ja","teilweise oder kostenpflichtig","nein","nicht vorhanden"],"n_title":"Was es bewusst nicht tut","n_items":["„RAM-Boost“ und das Beenden von Hintergrund-Apps. Android verwaltet den Speicher selbst; diese Schaltflächen helfen nicht und kosten Akku.","Den Cache anderer Apps mit einem Tipp leeren. Android verbietet das ohne Sonderrechte, daher führt LUSTRUM direkt zum Speicherbildschirm jeder App.","iOS. Das System erlaubt keine Bereinigung außerhalb des eigenen Bereichs einer App.","Rückgängig machen. Es gibt noch keinen Papierkorb und keine Vorschau: Löschungen sind endgültig, deshalb wird jede Aktion vorher bestätigt.","In den Ordner Android/data anderer Apps schauen. Android 11+ sperrt das für jede normale App; nur Root oder Shizuku können es, und LUSTRUM unterstützt sie noch nicht."],"d_title":"LUSTRUM holen","d_sub":"Beta — Version 0.4.0. Direkte Installation, ohne Store-Konto.","steps":["Laden Sie die APK aus der neuesten veröffentlichten Version herunter.","Erlauben Sie die Installation aus dieser Quelle, wenn Android fragt.","Öffnen Sie s drüber installieren.","ver":"Version","upd":"Zuletzt aktualisiert"},"hu":{"name":"Magyar","title":"LUSTRUM — Android tárhelytisztító. Reklámmentes. Internet nélkül.","meta":"A LUSTRUM megtalálja a felesleges fájlokat, duplikátumokat, hasonló fotókat és az alkalmazások maradványait az Android-telefonodon. Nyílt forráskódú, reklámmentes, és nem tud az internetre csatlakozni.","badge":"Nyílt forráskód · Reklámmentes · Tervezetten offline","h1a":"Vedd vissza a telefonod.","h1b":"Semmi nem hagyja el.","sub":"A LUSTRUM megtalálja a felesleges fájlokat, duplikátumokat, hasonló fotókat és az alkalmazások maradványait, és csak a jóváhagyásoddal törli őket. Nincs INTERNET-engedélye, így fizikailag sem tud semmit sehová küldeni.","cta1":"APK letöltése","cta2":"Forráskód","stats":["reklám","INTERNET-engedély","nyomkövető","nyelv"],"nav":["Funkciók","Összehasonlítás","Adatvédelem","Letöltés"],"f_title":"Mit tud","features":[["Tárhely egy pillantásra","Használt és szabad hely, képekre, videókra, hangra, dokumentumokra és archívumokra bontva."],["Nagy, régi és felesleges fájlok","50 MB feletti, egy éve érintetlen, ideiglenes fájlok, bélyegképek, kuka és megszakadt letöltések."],["Pontos duplikátumok","Méret, majd gyors ujjlenyomat, majd teljes SHA-256 alapján. Alapértelmezés szerint a legrégebbi másolat marad."],["Hasonló fotók","Az észlelési hash megtalálja az átméretezett, újramentett és ismételt felvételeket, láncolás nélkül csoportosítva. Te nézed át a csoportokat; alapból a legnagyobb másolat marad meg."],["Alkalmazásmaradványok","Régen eltávolított alkalmazások hátrahagyott mappái, valamint az üres mappák."],["Fotótömörítés","Újrakódolja a nagy JPEG-eket, és csak akkor cseréli le őket, ha az eredmény legalább 20%-kal kisebb. Az EXIF megmarad; a mozgó fényképeket és a HDR-felvételeket kihagyja."],["Alkalmazások, gyorsítótárak, nem használtak","Alkalmazásonkénti gyorsítótár-méret, utolsó használat dátuma, közvetlen ugrás a beállításokhoz vagy az eltávolításhoz."],["Eszközáll a — 0.4.0 verzió. Közvetlenül telepíthető, áruházi fiók nélkül.","steps":["Töltsd le az APK-t a legújabb kiadásból.","Engedélyezd a telepítést erről a forrásról, amikor az Android rákérdez.","Nyisd meg a LUSTRUM-ot, add meg a médiahozzáférést, és koppints a Keresésre. A választható extra hozzáférés feloldja a dokumentumokat, maradványokat és a tömörítést."],"d_btn":"APK letöltése","perm_title":"Az engedélyek, egyszerűen","perm_cols":["Engedély","Miért"],"perms":[["Média","Fotókat, videókat és hangfájlokat keres. Törléskor az Android megerősítést kér."],["Hozzáférés minden fájlhoz (választható)","Dokumentumok, felesleges fájlok, maradványok, üres mappák és tömörítés."],["Használati hozzáférés (választható)","Alkalmazásonkénti gyorsítótár-méret és az utolsó használat ideje."],["Csomag eltávolítása","Lehetővé teszi egy alkalmazás eltávolítását a listából."]],"lic":"MIT licenc alatt kiadva.","share":"Megosztás","a11y":["Akadálymentesítés","Magas kontraszt","Olvasható betűtípus","Nagyobb térköz","Animációk csökkentése","Hivatkozások aláhúzása","Visszaállítás","Bezárás"],"scroll":"Vissza a tetejére","zoom":["Nagyítás","Kicsinyítés","Képernyőhöz igazítás"],"mock":["Használt","szabad","Felszabadítható","felszabadítva"],"cats":["Képek","Videók","Hang","Dokumentumok","Archívumok"],"support":["Támogasd a projektet","Hívj meg egy kávéra"],"build_title":"Fordítás","build_text":"JDK 21, Android SDK, Gradle 8.14+: futtasd a `gradle assembleRelease` parancsot (a `gradle testDebugUnitTest` az egységteszteket futtatja). Az APK az `app/build/outputs/apk/release/` mappában jelenik meg. A Build APK munkafolyamat teszteli, lefordítja és kiadásként közzéteszi a main ágra érkező minden új verziót. Az APK-kat a tárolóban lévő stabil, nyilvános kulccsal írjuk alá (`tools/lustrum-public.jks`), így a frissítések a régi verzió fölé települnek; saját terjesztéshez add meg a saját kulcsodat tárolótitokként (`LUSTRUM_KEYSTORE_B64`, `LUSTRUM_STORE_PASS`, `LUSTRUM_KEY_PASS`, `LUSTRUM_KEY_ALIAS`).","status_title":"Állapot","status_text":"Béta. 8 egységteszt és a fordítás CI-ben fut; valódi telefonon még nem tesztelt. Frissítés a 0.3.0-s vagy régebbi verzióról: egyszer távolítsd el, mert azok más aláírókulcsot használtak; a 0.4.0-tól a frissítések a régi verzió fölé települnek.","ver":"Verzió","upd":"Utolsó frissítés"}};
const ORDER = ["en","ro","fr","it","es","pt","de","hu"];
const SITE = "https://lustrum.chiuta.ro/";
const COLS = ["LUSTRUM","CCleaner","SD Maid SE","Files by Google","Norton Clean / Avast Cleanup"];
const M = [["y","n","y","y","n"],["y","n","p","n","n"],["y","n","y","n","n"],["y","p","y","p","y"],["p","y","y","n","p"],["y","y","y","n","p"],["n","p","y","n","y"],["x","y","n","n","y"],["n","n","y","n","n"]];
const ICONS = ["📊","🗂️","👯","🖼️","🧹","🗜️","📱","🔋"];
const CATW = [38,24,14,16,8];
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let lang = "en", t = T.en;

function pick(){
  const q = new URLSearchParams(location.search).get("lang");
  if (q && T[q]) return q;
  const s = store.get("lustrum-lang");
  if (s && T[s]) return s;
  for (const l of (navigator.languages || [navigator.language || "en"])) {
    const c = String(l).slice(0,2).toLowerCase();
    if (T[c]) return c;
  }
  return "en";
}
function el(tag, cls, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(l){
  lang = l; t = T[l]; store.set("lustrum-lang", l);
  document.documentElement.lang = l;
  document.title = t.title;
  $('meta[name="description"]').setAttribute("content", t.meta);
  $('meta[property="og:title"]').setAttribute("content", t.title);
  $$("[data-k]").forEach(n => { const k = n.dataset.k; n.textContent = k === "shield" ? t.stats[1] : k === "coffee" ? t.support[1] : t[k]; });
  $$("[data-n]").forEach(n => n.textContent = t.nav[+n.dataset.n]);
  $$("[data-a]").forEach(n => n.textContent = t.a11y[+n.dataset.a]);
  $("#ptitle").textContent = t.a11y[0];
  $("#stats").innerHTML = ["0","0","0","8"].map((n,i) => `<div class="stat"><b>${n}</b><span>${esc(t.stats[i])}</span></div>`).join("");
  $("#fcards").innerHTML = t.features.map((f,i) => `<article class="card reveal"><div class="ic" aria-hidden="true">${ICONS[i]}</div><h3>${esc(f[0])}</h3><p>${esc(f[1])}</p></article>`).join("");
  $("#pts").innerHTML = t.points.map(p => `<li class="reveal">${esc(p)}</li>`).join("");
  $("#notdo").innerHTML = t.n_items.map(p => `<div class="card reveal"><p>${esc(p)}</p></div>`).join("");
  $("#steps").innerHTML = t.steps.map(p => `<li class="reveal">${esc(p)}</li>`).join("");
  $("#perms").innerHTML = t.perms.map(p => `<div class="reveal"><b>${esc(p[0])}</b><span>${esc(p[1])}</span></div>`).join("");
  const sym = {y:"✓",p:"~",n:"✗",x:"—"}, srI = {y:0,p:1,n:2,x:3};
  $("#tbl").innerHTML = "<thead><tr><th></th>" + COLS.map((c,i) => `<th class="${i?"":"me"}">${esc(c)}</th>`).join("") + "</tr></thead><tbody>" +
    M.map((r,ri) => `<tr><td>${esc(t.rows[ri])}</td>` + r.map((v,i) => `<td class="${i?"":"me"} ${v}"><span aria-hidden="true">${sym[v]}</span><span class="sr">${esc(t.sr[srI[v]])}</span></td>`).join("") + "</tr>").join("") + "</tbody>";
  $("#m_used").textContent = t.mock[0];
  $("#m_clr").textContent = t.mock[2];
  $("#m_fr").textContent = t.mock[3];
  $("#mcats").innerHTML = t.cats.map((c,i) => `<div class="cat"><span>${esc(c)}</span><i data-w="${CATW[i]}"></i></div>`).join("");
  $("#up").setAttribute("aria-label", t.scroll);
  $("#zin").setAttribute("aria-label", t.zoom[0]); $("#zin").title = t.zoom[0];
  $("#zout").setAttribute("aria-label", t.zoom[1]); $("#zout").title = t.zoom[1];
  $("#zfit").setAttribute("aria-label", t.zoom[2]); $("#zfit").title = t.zoom[2];
  buildShare();
  observe();
  runMock();
}

function buildShare(){
  const u = encodeURIComponent(SITE), tx = encodeURIComponent(t.title);
  const items = [
    ["X", "https://twitter.com/intent/tweet?url="+u+"&text="+tx],
    ["f", "https://www.facebook.com/sharer/sharer.php?u="+u],
    ["in", "https://www.linkedin.com/sharing/share-offsite/?url="+u],
    ["WA", "https://wa.me/?text="+tx+"%20"+u],
    ["TG", "https://t.me/share/url?url="+u+"&text="+tx],
    ["✉", "mailto:?subject="+tx+"&body="+u]
  ];
  const mk = () => {
    const f = document.createDocumentFragment();
    items.forEach(([l,h]) => { const a = el("a","rb sh",esc(l)); a.href = h; a.target = "_blank"; a.rel = "noopener noreferrer"; a.setAttribute("aria-label", t.share+": "+l); f.appendChild(a); });
    const c = el("button","rb sh","🔗"); c.type = "button"; c.setAttribute("aria-label", t.share+": link");
    c.onclick = () => { try { navigator.clipboard.writeText(SITE); c.textContent = "✓"; setTimeout(() => c.textContent = "🔗", 1400); } catch(e) {} };
    f.appendChild(c);
    return f;
  };
  $("#share-rail").replaceChildren(mk());
  const row = $("#share-row"); row.replaceChildren(el("span","",esc(t.share)+":"));
  row.appendChild(mk());
}

let io;
function observe(){
  const els = $$(".reveal");
  if (!("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:.12});
  els.forEach(e => io.observe(e));
}

let counted = false;
function runMock(){
  const reduce = document.documentElement.classList.contains("nm") || matchMedia("(prefers-reduced-motion:reduce)").matches;
  const ring = $("#ringv");
  const go = () => {
    ring.style.strokeDashoffset = String(352 * (1 - .72));
    $$("#mcats i").forEach(i => i.style.width = i.dataset.w + "%");
    const out = $("#cnt"), target = 4.2;
    if (reduce) { out.textContent = target.toFixed(1); return; }
    if (counted) { out.textContent = target.toFixed(1); return; }
    counted = true;
    const t0 = performance.now();
    const step = now => { const p = Math.min(1, (now - t0) / 2200); out.textContent = (target * (1 - Math.pow(1 - p, 3))).toFixed(1); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  };
  setTimeout(go, 350);
}

/* language selector */
const sel = $("#lang");
ORDER.forEach(c => { const o = el("option","",esc(T[c].name)); o.value = c; sel.appendChild(o); });
sel.onchange = () => render(sel.value);

/* accessibility + zoom, persisted */
const S = {z:1, hc:0, rf:0, sp:0, nm:0, ul:0};
try { Object.assign(S, JSON.parse(store.get("lustrum-a11y") || "{}")); } catch(e) {}
function applyA(){
  const r = document.documentElement;
  r.style.setProperty("--z", S.z);
  ["hc","rf","sp","nm","ul"].forEach(k => r.classList.toggle(k, !!S[k]));
  $$("#panel input[data-f]").forEach(i => i.checked = !!S[i.dataset.f]);
  store.set("lustrum-a11y", JSON.stringify(S));
}
$("#zin").onclick = () => { S.z = Math.min(1.6, +(S.z + .1).toFixed(2)); applyA(); };
$("#zout").onclick = () => { S.z = Math.max(.8, +(S.z - .1).toFixed(2)); applyA(); };
$("#zfit").onclick = () => { S.z = 1; applyA(); };
$$("#panel input[data-f]").forEach(i => i.onchange = () => { S[i.dataset.f] = i.checked ? 1 : 0; applyA(); });
$("#areset").onclick = () => { Object.assign(S, {z:1,hc:0,rf:0,sp:0,nm:0,ul:0}); applyA(); };
const panel = $("#panel"), aa = $("#aa");
function tp(on){ panel.classList.toggle("on", on); aa.setAttribute("aria-expanded", String(on)); }
aa.onclick = () => tp(!panel.classList.contains("on"));
$("#aclose").onclick = () => { tp(false); aa.focus(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") tp(false); });

/* scroll-up arrow */
addEventListener("scroll", () => $("#up").classList.toggle("on", scrollY > 500), {passive:true});

applyA();
const start = pick(); sel.value = start; render(start);
</script>
</body>
