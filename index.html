<script>
const T = {"en":{"name":"English","title":"LUSTRUM — Android storage cleaner. No ads. No internet.","meta":"LUSTRUM finds junk, duplicates, look-alike photos and app leftovers on your Android phone. Open source, ad-free, and it cannot go online.","badge":"Open source · Ad-free · Offline by design","h1a":"Reclaim your phone.","h1b":"Nothing leaves it.","sub":"LUSTRUM finds junk, duplicates, look-alike photos and app leftovers — and clears them only with your approval. It has no INTERNET permission, so it physically cannot send anything anywhere.","cta1":"Download APK","cta2":"Source code","stats":["ads","INTERNET permission","trackers","languages"],"nav":["Features","Demo","Compare","Privacy","Download"],"f_title":"What it does","features":[["Storage at a glance","Used and free space, broken down by images, video, audio, documents and archives."],["Large, old & junk files","Files over 50 MB, untouched for a year, temp files, thumbnails, trash and interrupted downloads."],["Exact duplicates","Matched by size, then a quick fingerprint, then full SHA-256. The oldest copy is kept by default."],["Look-alike photos","Perceptual hashing finds resized, re-saved and repeated shots, grouped without chaining. You review each group; the largest copy is kept by default."],["App leftovers","Folders left behind by apps you uninstalled long ago, plus empty folders."],["Photo compression","Re-encodes big JPEGs and replaces them only if the result is at least 20% smaller. EXIF is kept; Motion Photos and HDR shots are skipped."],["Apps, caches & unused","Cache size per app, last-used date, one tap to its settings or to uninstall."],["Device status","RAM, battery level and temperature — read-only, for information."],["Blurry & dark photos","Measures sharpness and brightness on a small copy of each photo and lists the likely rejects for you to review."],["Safe delete with undo","Optional LUSTRUM trash: deleted files wait 30 days and can be restored; space is freed when you empty it."],["Previews & biggest folders","Thumbnails in every list, a ranking of the folders that eat your storage, and a running total of what you have freed."],["Swiper","Go through photos and videos one by one, oldest first: swipe left to delete, right to keep. Nothing is removed until you confirm at the end."],["Scheduled cleaning","Weekly or monthly, in the background, on a good battery: a notification, or automatic clean-up of obvious junk older than 24 hours only. Cleaned files always go to the 30-day LUSTRUM trash first."],["Best photo & similar videos","In each look-alike group the sharpest copy is suggested first. Similar videos are matched by a middle frame and near-identical length."],["System-assisted cache trim","Asks Android to free other apps' cached data by requesting storage. Results vary by device; there is no root-level magic. On rooted phones it also uses root to clear all caches."]],"p_title":"Private by construction","p_text":"Most cleaners earn their keep from ads and data. LUSTRUM is built the other way around.","points":["No INTERNET permission in the manifest — you can verify it in your system's app info.","No accounts, no analytics, no ads, no purchase prompts.","Every deletion is confirmed first; media deletions go through Android's own system dialog.","Built-in safety checks: Motion Photos and HDR photos are never recompressed, files changed in the last 24 hours are never called junk, and nothing outside shared storage can be deleted.","Scheduled cleaning acts only on obvious junk older than 24 hours and always moves it to the LUSTRUM trash first, never straight to deletion."],"c_title":"How it compares","c_sub":"Against the best-known cleaners, based on their public descriptions (November 2026). Competitor cells come from public descriptions and were not tested by us. LUSTRUM's compression (JPEG only) and scheduling (obvious junk only) are partial; mature tools such as SD Maid SE do more.","rows":["No ads","No internet access or telemetry","Open source","Duplicates & look-alike photos","Leftovers of uninstalled apps","Photo compression","Scheduled cleaning","“RAM boost”","Root / Shizuku support"],"legend":"✓ yes · ~ partial or paid · ✗ no · — not offered, on purpose","sr":["yes","partial or paid","no","not offered"],"n_title":"What it will not do — on purpose","n_items":["“RAM boost” and background-app killers. Android manages memory itself; these buttons don't help and drain the battery.","Guaranteed one-tap clearing of other apps' caches. Android forbids it without special privileges; LUSTRUM offers a system-assisted trim (results vary) and links to each app's storage screen.","iOS. The system does not allow cleaning outside an app's own sandbox.","Aggressive background automation. Scheduled cleaning only touches obvious junk older than 24 hours, never your photos or documents.","Look inside other apps' Android/data folders. Android 11+ blocks this for every normal app; only root or Shizuku can. LUSTRUM uses root only for the cache trim and does not support Shizuku."],"d_title":"Get LUSTRUM","d_sub":"Beta — version 0.8.0. Installs directly; no store account needed.","steps":["Download the APK from the latest release.","Allow installation from this source when Android asks.","Open LUSTRUM, grant media access and tap Scan. Optional extra access unlocks documents, leftovers and compression."],"d_btn":"Download APK","perm_title":"Permissions, in plain words","perm_cols":["Permission","Why"],"perms":[["Media","Scans photos, video and audio. Deleting asks Android for confirmation."],["All files access (optional)","Documents, junk, leftovers, empty folders and compression."],["Usage access (optional)","Cache size per app and when each app was last used."],["Package removal","Lets you uninstall an app from the list."]],"lic":"Released under the MIT licence.","share":"Share","a11y":["Accessibility","High contrast","Readable font","More spacing","Reduce motion","Underline links","Reset","Close"],"scroll":"Back to top","zoom":["Zoom in","Zoom out","Fit to screen"],"mock":["Used","free","Can be cleared","freed"],"cats":["Images","Video","Audio","Documents","Archives"],"support":["Support the project","Buy me a coffee"],"build_title":"Building","build_text":"JDK 21, Android SDK, Gradle 8.14+: run `gradle assembleRelease` (`gradle testDebugUnitTest` runs the unit tests). The APK appears in `app/build/outputs/apk/release/`. The Build APK workflow tests, builds and publishes a release for every new version pushed to main. APKs are signed with a stable public key kept in the repository (`tools/lustrum-public.jks`), so updates install over each other; for your own distribution add your key as repository secrets (`LUSTRUM_KEYSTORE_B64`, `LUSTRUM_STORE_PASS`, `LUSTRUM_KEY_PASS`, `LUSTRUM_KEY_ALIAS`).","status_title":"Status","status_text":"Beta. 25 unit tests, 11 instrumented tests on an Android emulator and a smoke test of the minified release build run in CI; not yet tested on a physical phone. Translations are machine-made and not reviewed by native speakers. Builds from 0.4.0 on share one signing key, so updates install over the old version (from 0.3.0 or earlier, uninstall once).","ver":"Version","upd":"Last updated","demo_title":"See it in action","demo_note":"Real screenshots and screen recordings of LUSTRUM running on an Android emulator with generated sample files — not on a physical phone.","demo_shots":["Home: storage at a glance and a one-tap scan","Junk files found, ready to review","Identical files, one copy kept per group","Look-alike photos: the sharpest copy is kept","Swiper: swipe to keep or delete, nothing is removed until you confirm","Scheduled cleaning, safe delete and cache trim"],"demo_vids":["Scanning the phone","Finding duplicates","Swiper in action","Scheduling automatic cleaning"],"demo_vtitle":"Short demo videos"},"ro":{"name":"Română","title":"LUSTRUM — Curățător de stocare pentru Android. Fără reclame. Fără internet.","meta":"LUSTRUM găsește resturi, duplicate, fotografii asemănătoare și rămășițe de aplicații pe telefonul tău Android. Open source, fără reclame, nu se poate conecta la internet.","badge":"Open source · Fără reclame · Offline prin construcție","h1a":"Recapătă-ți telefonul.","h1b":"Nimic nu pleacă din el.","sub":"LUSTRUM găsește resturi, duplicate, fotografii asemănătoare și rămășițe de aplicații și le șterge doar cu acordul tău. Nu are permisiunea INTERNET, deci nu poate trimite nimic nicăieri.","cta1":"Descarcă APK","cta2":"Cod sursă","stats":["reclame","permisiune INTERNET","urmăritoare","limbi"],"nav":["Funcții","Demo","Comparație","Confidențialitate","Descarcă"],"f_title":"Ce face","features":[["Stocarea dintr-o privire","Spațiu folosit și liber, defalcat pe imagini, video, audio, documente și arhive."],["Fișiere mari, vechi și resturi","Fișiere peste 50 MB, neatinse de un an, temporare, miniaturi, coș și descărcări întrerupte."],["Duplicate exacte","Comparate după mărime, apoi amprentă rapidă, apoi SHA-256 complet. Implicit se păstrează cel mai vechi exemplar."],["Fotografii asemănătoare","Hash perceptual: găsește aceeași poză redimensionată, resalvată sau repetată, grupată fără înlănțuire. Tu verifici fiecare grup; implicit se păstrează cea mai mare copie."],["Rămășițe de aplicații","Foldere lăsate de aplicații dezinstalate de mult, plus folderele goale."],["Comprimare foto","Recomprimă JPEG-urile mari și le înlocuiește doar dacă rezultatul e cu cel puțin 20% mai mic. EXIF se păstrează; fotografiile cu video încorporat și cele HDR sunt ocolite."],["Aplicații, cache și nefolosite","Mărimea cache-ului per aplicație, data ultimei folosiri, un clic spre setări sau dezinstalare."],["Starea dispozitivului","RAM, nivelul și temperatura bateriei — doar citire, informativ."],["Poze neclare și întunecate","Măsoară claritatea și luminozitatea pe o copie mică a fiecărei poze și listează probabilele rebuturi, ca să le verifici tu."],["Ștergere sigură, cu anulare","Coș LUSTRUM opțional: fișierele șterse așteaptă 30 de zile și pot fi restaurate; spațiul se eliberează când golești coșul."],["Miniaturi și cele mai mari foldere","Miniaturi în fiecare listă, un clasament al folderelor care îți mănâncă spațiul și totalul eliberat până acum."],["Swiper","Treci prin poze și videoclipuri pe rând, cele mai vechi întâi: glisează la stânga ca să ștergi, la dreapta ca să păstrezi. Nimic nu dispare până nu confirmi la final."],["Curățare programată","Săptămânal sau lunar, în fundal, cu baterie suficientă: o notificare sau curățarea automată doar a resturilor evidente mai vechi de 24 de ore. Fișierele curățate merg întotdeauna întâi în coșul LUSTRUM de 30 de zile."],["Poza cea mai bună și videoclipuri asemănătoare","În fiecare grup de poze asemănătoare, cea mai clară copie e propusă prima. Videoclipurile asemănătoare sunt potrivite după un cadru din mijloc și o durată aproape identică."],["Reducerea cache-ului, asistată de sistem","Cere Android să elibereze datele din cache ale altor aplicații, solicitând spațiu. Rezultatul diferă între dispozitive; nu există magie la nivel de root. Pe telefoanele cu root folosește și root pentru a goli toate cache-urile."]],"p_title":"Privat prin construcție","p_text":"Majoritatea curățătoarelor trăiesc din reclame și date. LUSTRUM e făcut invers.","points":["Fără permisiunea INTERNET în manifest — o poți verifica în informațiile aplicației din sistem.","Fără conturi, analitice, reclame sau cereri de plată.","Orice ștergere e confirmată; ștergerea media trece prin dialogul propriu Android.","Verificări de siguranță încorporate: fotografiile cu video încorporat (Motion Photo) și cele HDR nu sunt niciodată recomprimate, fișierele modificate în ultimele 24 de ore nu sunt considerate resturi, iar în afara stocării partajate nu se poate șterge nimic.","Curățarea programată acționează doar asupra resturilor evidente mai vechi de 24 de ore și le mută întotdeauna întâi în coșul LUSTRUM, niciodată direct la ștergere."],"c_title":"Cum se compară","c_sub":"Față de cele mai cunoscute curățătoare, pe baza descrierilor lor publice (noiembrie 2026). Celulele concurenților provin din descrieri publice și nu au fost testate de noi. Comprimarea LUSTRUM (doar JPEG) și programarea (doar resturi evidente) sunt parțiale; unelte mature precum SD Maid SE fac mai mult.","rows":["Fără reclame","Fără acces la internet sau telemetrie","Open source","Duplicate și fotografii asemănătoare","Rămășițe de la aplicații dezinstalate","Comprimare foto","Curățare programată","„Boost RAM”","Suport root / Shizuku"],"legend":"✓ da · ~ parțial sau contra cost · ✗ nu · — nu există, intenționat","sr":["da","parțial sau contra cost","nu","nu există"],"n_title":"Ce nu face — intenționat","n_items":["„Boost RAM” și oprirea aplicațiilor din fundal. Android gestionează singur memoria; butoanele astea nu ajută și consumă baterie.","Golirea garantată, dintr-o atingere, a cache-ului altor aplicații. Android o interzice fără privilegii speciale; LUSTRUM oferă o reducere asistată de sistem (rezultate variabile) și trimite la ecranul de stocare al fiecărei aplicații.","iOS. Sistemul nu permite curățare în afara propriului spațiu al aplicației.","Automatizare agresivă în fundal. Curățarea programată atinge doar resturile evidente mai vechi de 24 de ore, niciodată pozele sau documentele tale.","Să se uite în folderele Android/data ale altor aplicații. Android 11+ blochează asta pentru orice aplicație obișnuită; doar root sau Shizuku pot. LUSTRUM folosește root doar pentru reducerea cache-ului și nu suportă Shizuku."],"d_title":"Obține LUSTRUM","d_sub":"Beta — versiunea 0.8.0. Se instalează direct; nu ai nevoie de cont de magazin.","steps":["Descarcă APK-ul din ultima versiune publicată.","Permite instalarea din această sursă când Android te întreabă.","Deschide LUSTRUM, acordă accesul la media și apasă Scanează. Accesul suplimentar opțional deblochează documentele, rămășițele și comprimarea."],"d_btn":"Descarcă APK","perm_title":"Permisiunile, pe înțelesul tuturor","perm_cols":["Permisiune","De ce"],"perms":[["Media","Scanează fotografii, video și audio. La ștergere, Android cere confirmare."],["Acces la toate fișierele (opțional)","Documente, resturi, rămășițe, foldere goale și comprimare."],["Acces la utilizare (opțional)","Mărimea cache-ului per aplicație și când a fost folosită ultima oară."],["Ștergere pachete","Îți permite să dezinstalezi o aplicație din listă."]],"lic":"Publicat sub licența MIT.","share":"Distribuie","a11y":["Accesibilitate","Contrast ridicat","Font lizibil","Spațiere mai mare","Reduce animațiile","Subliniază linkurile","Resetează","Închide"],"scroll":"Sus","zoom":["Mărește","Micșorează","Potrivește la ecran"],"mock":["Folosit","liber","Se poate elibera","eliberați"],"cats":["Imagini","Video","Audio","Documente","Arhive"],"support":["Susține proiectul","Cumpără-mi o cafea"],"build_title":"Construire","build_text":"JDK 21, Android SDK, Gradle 8.14+: rulează `gradle assembleRelease` (`gradle testDebugUnitTest` rulează testele unitare). APK-ul apare în `app/build/outputs/apk/release/`. Fluxul Build APK testează, compilează și publică o versiune pentru fiecare versiune nouă ajunsă pe main. APK-urile sunt semnate cu o cheie publică stabilă din repo (`tools/lustrum-public.jks`), deci actualizările se instalează peste versiunea veche; pentru distribuția ta adaugă propria cheie ca secrete de repo (`LUSTRUM_KEYSTORE_B64`, `LUSTRUM_STORE_PASS`, `LUSTRUM_KEY_PASS`, `LUSTRUM_KEY_ALIAS`).","status_title":"Stare","status_text":"Beta. 25 de teste unitare, 11 teste instrumentate pe un emulator Android și un test de fum al versiunii release minificate rulează în CI; încă netestat pe un telefon fizic. Traducerile sunt automate și nerevizuite de vorbitori nativi. Versiunile de la 0.4.0 încoace au aceeași cheie de semnare, deci actualizările se instalează peste cea veche (de la 0.3.0 sau mai vechi, dezinstalează o dată).","ver":"Versiune","upd":"Ultima actualizare","demo_title":"Vezi-l în acțiune","demo_note":"Capturi de ecran și înregistrări reale cu LUSTRUM rulând pe un emulator Android, cu fișiere de probă generate — nu pe un telefon fizic.","demo_shots":["Acasă: spațiul dintr-o privire și scanare dintr-o atingere","Resturi găsite, gata de verificat","Fișiere identice, o copie păstrată în fiecare grup","Poze asemănătoare: se păstrează cea mai clară copie","Swiper: glisezi ca să păstrezi sau să ștergi, nimic nu dispare până nu confirmi","Curățare programată, ștergere sigură și reducere cache"],"demo_vids":["Scanarea telefonului","Căutarea duplicatelor","Swiper în acțiune","Programarea curățării automate"],"demo_vtitle":"Videoclipuri demonstrative scurte"},"fr":{"name":"Français","title":"LUSTRUM — Nettoyeur de stockage Android. Sans pub. Sans internet.","meta":"LUSTRUM détecte fichiers inutiles, doublons, photos similaires et restes d'applications sur votre téléphone Android. Open source, sans publicité, incapable de se connecter à internet.","badge":"Open source · Sans pub · Hors ligne par conception","h1a":"Reprenez votre téléphone.","h1b":"Rien n'en sort.","sub":"LUSTRUM repère fichiers inutiles, doublons, photos similaires et restes d'applications, et ne les supprime qu'avec votre accord. Il n'a pas la permission INTERNET : il ne peut physiquement rien envoyer.","cta1":"Télécharger l'APK","cta2":"Code source","stats":["publicités","permission INTERNET","traqueurs","langues"],"nav":["Fonctions","Démo","Comparaison","Confidentialité","Télécharger"],"f_title":"Ce qu'il fait","features":[["Le stockage d'un coup d'œil","Espace utilisé et libre, réparti entre images, vidéos, audio, documents et archives."],["Gros fichiers, anciens et inutiles","Fichiers de plus de 50 Mo, intacts depuis un an, temporaires, miniatures, corbeille et téléchargements interrompus."],["Doublons exacts","Comparés par taille, puis empreinte rapide, puis SHA-256 complet. L'exemplaire le plus ancien est conservé par défaut."],["Photos similaires","Le hachage perceptuel repère les clichés redimensionnés, réenregistrés ou répétés, groupés sans chaînage. Vous vérifiez chaque groupe ; la plus grande copie est conservée par défaut."],["Restes d'applications","Dossiers laissés par des applications désinstallées depuis longtemps, et dossiers vides."],["Compression photo","Réencode les gros JPEG et ne les remplace que si le résultat est au moins 20 % plus léger. L'EXIF est conservé ; les Motion Photos et les photos HDR sont ignorées."],["Applications, caches et inutilisées","Taille du cache par application, date de dernière utilisation, accès direct aux réglages ou à la désinstallation."],["État de l'appareil","RAM, niveau et température de la batterie — en lecture seule, à titre informatif."],["Photos floues et sombres","Mesure la netteté et la luminosité sur une petite copie de chaque photo et liste les ratées probables, à vérifier par vous."],["Suppression sécurisée, annulable","Corbeille LUSTRUM facultative : les fichiers supprimés attendent 30 jours et peuvent être restaurés ; l'espace est libéré au vidage."],["Aperçus et plus gros dossiers","Miniatures dans chaque liste, un classement des dossiers qui mangent votre stockage et le total libéré jusqu'ici."],["Swiper","Passez photos et vidéos en revue une à une, les plus anciennes d'abord : glissez à gauche pour supprimer, à droite pour garder. Rien n'est supprimé avant votre confirmation finale."],["Nettoyage programmé","Chaque semaine ou chaque mois, en arrière-plan, batterie suffisante : une notification, ou le nettoyage automatique des seuls fichiers inutiles évidents de plus de 24 h. Les fichiers nettoyés vont toujours d'abord dans la corbeille LUSTRUM de 30 jours."],["Meilleure photo et vidéos similaires","Dans chaque groupe de photos similaires, la copie la plus nette est proposée en premier. Les vidéos similaires sont repérées par une image du milieu et une durée presque identique."],["Réduction du cache assistée par le système","Demande à Android de libérer le cache des autres applications en réclamant de l'espace. Le résultat varie selon l'appareil ; pas de magie root. Sur les téléphones rootés, il utilise aussi le root pour vider tous les caches."]],"p_title":"Privé par construction","p_text":"La plupart des nettoyeurs vivent de publicité et de données. LUSTRUM fait l'inverse.","points":["Aucune permission INTERNET dans le manifeste — vérifiable dans les informations de l'application.","Pas de compte, pas d'analyse, pas de pub, pas d'incitation à payer.","Chaque suppression est confirmée ; pour les médias, c'est la boîte de dialogue d'Android qui s'en charge.","Garde-fous intégrés : les Motion Photos et les photos HDR ne sont jamais recompressées, les fichiers modifiés depuis moins de 24 h ne sont jamais traités comme inutiles, et rien hors du stockage partagé ne peut être supprimé.","Le nettoyage programmé n'agit que sur les fichiers inutiles évidents de plus de 24 h et les déplace toujours d'abord dans la corbeille LUSTRUM, jamais directement à la suppression."],"c_title":"Comparaison","c_sub":"Face aux nettoyeurs les plus connus, d'après leurs descriptions publiques (novembre 2026). Les cellules des concurrents viennent de descriptions publiques et n'ont pas été testées par nous. La compression de LUSTRUM (JPEG seulement) et la planification (fichiers inutiles évidents seulement) sont partielles ; des outils matures comme SD Maid SE font plus.","rows":["Sans publicité","Sans accès internet ni télémétrie","Open source","Doublons et photos similaires","Restes d'applications désinstallées","Compression photo","Nettoyage planifié","« Boost RAM »","Prise en charge root / Shizuku"],"legend":"✓ oui · ~ partiel ou payant · ✗ non · — absent, volontairement","sr":["oui","partiel ou payant","non","absent"],"n_title":"Ce qu'il ne fait pas — volontairement","n_items":["Le « boost RAM » et les tueurs d'applications en arrière-plan. Android gère la mémoire seul ; ces boutons n'aident pas et vident la batterie.","Vider à coup sûr, en un geste, le cache des autres applications. Android l'interdit sans privilèges spéciaux ; LUSTRUM propose une réduction assistée par le système (résultats variables) et renvoie à l'écran de stockage de chaque application.","iOS. Le système interdit tout nettoyage hors du bac à sable de l'application.","Une automatisation agressive en arrière-plan. Le nettoyage programmé ne touche que les fichiers inutiles évidents de plus de 24 h, jamais vos photos ni documents.","Regarder dans les dossiers Android/data des autres applications. Android 11+ l'interdit à toute application ordinaire ; seuls root ou Shizuku le permettent. LUSTRUM n'utilise root que pour réduire le cache et ne gère pas Shizuku."],"d_title":"Obtenir LUSTRUM","d_sub":"Bêta — version 0.8.0. Installation directe, sans compte de boutique.","steps":["Téléchargez l'APK depuis la dernière version publiée.","Autorisez l'installation depuis cette source lorsque Android le demande.","Ouvrez LUSTRUM, accordez l'accès aux médias et touchez Analyser. Un accès supplémentaire facultatif débloque documents, restes et compression."],"d_btn":"Télécharger l'APK","perm_title":"Les permissions, en clair","perm_cols":["Permission","Pourquoi"],"perms":[["Médias","Analyse photos, vidéos et audio. Pour supprimer, Android demande confirmation."],["Accès à tous les fichiers (facultatif)","Documents, fichiers inutiles, restes, dossiers vides et compression."],["Accès aux données d'utilisation (facultatif)","Taille du cache par application et date de dernière utilisation."],["Suppression de paquets","Permet de désinstaller une application depuis la liste."]],"lic":"Publié sous licence MIT.","share":"Partager","a11y":["Accessibilité","Contraste élevé","Police lisible","Espacement accru","Réduire les animations","Souligner les liens","Réinitialiser","Fermer"],"scroll":"Haut de page","zoom":["Agrandir","Réduire","Ajuster à l'écran"],"mock":["Utilisé","libre","Peut être libéré","libérés"],"cats":["Images","Vidéos","Audio","Documents","Archives"],"support":["Soutenir le projet","Offrez-moi un café"],"build_title":"Compilation","build_text":"JDK 21, SDK Android, Gradle 8.14+ : lancez `gradle assembleRelease` (`gradle testDebugUnitTest` exécute les tests unitaires). L'APK apparaît dans `app/build/outputs/apk/release/`. Le workflow Build APK teste, compile et publie une version pour chaque nouvelle version poussée sur main. Les APK sont signés avec une clé publique stable du dépôt (`tools/lustrum-public.jks`), donc les mises à jour s'installent par-dessus ; pour votre propre diffusion, ajoutez votre clé en secrets du dépôt (`LUSTRUM_KEYSTORE_B64`, `LUSTRUM_STORE_PASS`, `LUSTRUM_KEY_PASS`, `LUSTRUM_KEY_ALIAS`).","status_title":"État","status_text":"Bêta. 25 tests unitaires, 11 tests instrumentés sur émulateur Android et un test de fumée de la version release minifiée tournent en CI ; pas encore testé sur un téléphone physique. Les traductions sont automatiques, non relues par des natifs. Les versions depuis 0.4.0 partagent une clé de signature : les mises à jour s'installent par-dessus (depuis 0.3.0 ou avant, désinstallez une fois).","ver":"Version","upd":"Dernière mise à jour","demo_title":"Voir en action","demo_note":"Vraies captures et enregistrements d'écran de LUSTRUM sur un émulateur Android avec des fichiers d'exemple générés — pas sur un téléphone physique.","demo_shots":["Accueil : le stockage en un coup d'œil et une analyse en un geste","Fichiers inutiles trouvés, prêts à vérifier","Fichiers identiques, une copie conservée par groupe","Photos similaires : la plus nette est conservée","Swiper : glissez pour garder ou supprimer, rien n'est retiré avant confirmation","Nettoyage programmé, suppression sécurisée et réduction du cache"],"demo_vids":["Analyse du téléphone","Recherche de doublons","Swiper en action","Programmer le nettoyage automatique"],"demo_vtitle":"Courtes vidéos de démonstration"},"it":{"name":"Italiano","title":"LUSTRUM — Pulitore di archiviazione Android. Senza pubblicità. Senza internet.","meta":"LUSTRUM trova file inutili, duplicati, foto simili e residui di app sul tuo telefono Android. Open source, senza pubblicità, non può collegarsi a internet.","badge":"Open source · Senza pubblicità · Offline per progetto","h1a":"Riprenditi il telefono.","h1b":"Niente ne esce.","sub":"LUSTRUM trova file inutili, duplicati, foto simili e residui di app, e li elimina solo con il tuo consenso. Non ha il permesso INTERNET, quindi non può inviare nulla da nessuna parte.","cta1":"Scarica l'APK","cta2":"Codice sorgente","stats":["pubblicità","permesso INTERNET","tracker","lingue"],"nav":["Funzioni","Demo","Confronto","Privacy","Scarica"],"f_title":"Cosa fa","features":[["Archiviazione a colpo d'occhio","Spazio usato e libero, suddiviso in immagini, video, audio, documenti e archivi."],["File grandi, vecchi e inutili","File oltre 50 MB, intatti da un anno, temporanei, miniature, cestino e download interrotti."],["Duplicati esatti","Confrontati per dimensione, poi impronta rapida, poi SHA-256 completo. Per impostazione predefinita resta la copia più vecchia."],["Foto simili","L'hash percettivo trova scatti ridimensionati, risalvati o ripetuti, raggruppati senza concatenazioni. Controlli tu ogni gruppo; per impostazione predefinita si tiene la copia più grande."],["Residui di app","Cartelle lasciate da app disinstallate da tempo, più le cartelle vuote."],["Compressione foto","Ricodifica i JPEG grandi e li sostituisce solo se il risultato è almeno il 20% più leggero. L'EXIF si conserva; Motion Photo e foto HDR vengono saltate."],["App, cache e inutilizzate","Dimensione della cache per app, data dell'ultimo utilizzo, accesso diretto alle impostazioni o alla disinstallazione."],["Stato del dispositivo","RAM, livello e temperatura della batteria — sola lettura, a scopo informativo."],["Foto sfocate e scure","Misura nitidezza e luminosità su una piccola copia di ogni foto ed elenca i probabili scarti, da verificare."],["Eliminazione sicura con annullamento","Cestino LUSTRUM opzionale: i file eliminati attendono 30 giorni e si possono ripristinare; lo spazio si libera allo svuotamento."],["Anteprime e cartelle più grandi","Miniature in ogni elenco, una classifica delle cartelle che occupano più spazio e il totale liberato finora."],["Swiper","Scorri foto e video uno a uno, dai più vecchi: scorri a sinistra per eliminare, a destra per tenere. Nulla viene rimosso finché non confermi alla fine."],["Pulizia programmata","Ogni settimana o mese, in background, con batteria adeguata: una notifica, oppure la pulizia automatica dei soli file inutili evidenti più vecchi di 24 ore. I file puliti vanno sempre prima nel cestino LUSTRUM di 30 giorni."],["Foto migliore e video simili","In ogni gruppo di foto simili viene proposta per prima la copia più nitida. I video simili sono individuati da un fotogramma centrale e da una durata quasi identica."],["Riduzione della cache assistita dal sistema","Chiede ad Android di liberare la cache delle altre app richiedendo spazio. Il risultato varia da dispositivo a dispositivo; nessuna magia da root. Sui telefoni con root usa anche il root per svuotare tutte le cache."]],"p_title":"Privato per costruzione","p_text":"La maggior parte dei pulitori vive di pubblicità e dati. LUSTRUM è fatto al contrario.","points":["Nessun permesso INTERNET nel manifest — lo verifichi nelle info dell'app del sistema.","Niente account, analisi, pubblicità o richieste di pagamento.","Ogni eliminazione è confermata; per i contenuti multimediali interviene la finestra di dialogo di Android.","Controlli di sicurezza integrati: le Motion Photo e le foto HDR non vengono mai ricompresse, i file modificati nelle ultime 24 ore non sono mai considerati inutili e nulla fuori dall'archiviazione condivisa può essere eliminato.","La pulizia programmata agisce solo sui file inutili evidenti più vecchi di 24 ore e li sposta sempre prima nel cestino LUSTRUM, mai direttamente all'eliminazione."],"c_title":"Il confronto","c_sub":"Con i pulitori più noti, in base alle loro descrizioni pubbliche (novembre 2026). Le celle dei concorrenti provengono da descrizioni pubbliche e non sono state testate da noi. La compressione di LUSTRUM (solo JPEG) e la pianificazione (solo file inutili evidenti) sono parziali; strumenti maturi come SD Maid SE fanno di più.","rows":["Senza pubblicità","Senza accesso a internet né telemetria","Open source","Duplicati e foto simili","Residui di app disinstallate","Compressione foto","Pulizia programmata","«Boost RAM»","Supporto root / Shizuku"],"legend":"✓ sì · ~ parziale o a pagamento · ✗ no · — assente, di proposito","sr":["sì","parziale o a pagamento","no","assente"],"n_title":"Cosa non fa — di proposito","n_items":["Il «boost RAM» e i chiusori di app in background. Android gestisce da solo la memoria; questi pulsanti non servono e scaricano la batteria.","Svuotare con certezza, con un tocco, la cache delle altre app. Android lo vieta senza privilegi speciali; LUSTRUM offre una riduzione assistita dal sistema (risultati variabili) e rimanda alla schermata di archiviazione di ogni app.","iOS. Il sistema non consente pulizie fuori dall'area riservata dell'app.","Automazione aggressiva in background. La pulizia programmata tocca solo i file inutili evidenti più vecchi di 24 ore, mai le tue foto o i documenti.","Guardare nelle cartelle Android/data delle altre app. Android 11+ lo vieta a ogni app normale; solo root o Shizuku possono. LUSTRUM usa il root solo per la riduzione della cache e non supporta Shizuku."],"d_title":"Ottieni LUSTRUM","d_sub":"Beta — versione 0.8.0. Si installa direttamente, senza account di uno store.","steps":["Scarica l'APK dall'ultima versione pubblicata.","Consenti l'installazione da questa fonte quando Android lo chiede.","Apri LUSTRUM, concedi l'accesso ai contenuti multimediali e tocca Scansiona. Un accesso extra facoltativo sblocca documenti, residui e compressione."],"d_btn":"Scarica l'APK","perm_title":"I permessi, in parole semplici","perm_cols":["Permesso","Perché"],"perms":[["Contenuti multimediali","Analizza foto, video e audio. Per eliminare, Android chiede conferma."],["Accesso a tutti i file (facoltativo)","Documenti, file inutili, residui, cartelle vuote e compressione."],["Accesso ai dati di utilizzo (facoltativo)","Dimensione della cache per app e data dell'ultimo utilizzo."],["Rimozione pacchetti","Consente di disinstallare un'app dall'elenco."]],"lic":"Rilasciato con licenza MIT.","share":"Condividi","a11y":["Accessibilità","Contrasto elevato","Carattere leggibile","Più spaziatura","Riduci animazioni","Sottolinea i link","Ripristina","Chiudi"],"scroll":"Torna su","zoom":["Ingrandisci","Riduci","Adatta allo schermo"],"mock":["Usato","libero","Si può liberare","liberati"],"cats":["Immagini","Video","Audio","Documenti","Archivi"],"support":["Sostieni il progetto","Offrimi un caffè"],"build_title":"Compilazione","build_text":"JDK 21, Android SDK, Gradle 8.14+: esegui `gradle assembleRelease` (`gradle testDebugUnitTest` esegue i test unitari). L'APK compare in `app/build/outputs/apk/release/`. Il workflow Build APK testa, compila e pubblica una release per ogni nuova versione su main. Gli APK sono firmati con una chiave pubblica stabile nel repository (`tools/lustrum-public.jks`), quindi gli aggiornamenti si installano sopra; per una tua distribuzione aggiungi la tua chiave come secret del repository (`LUSTRUM_KEYSTORE_B64`, `LUSTRUM_STORE_PASS`, `LUSTRUM_KEY_PASS`, `LUSTRUM_KEY_ALIAS`).","status_title":"Stato","status_text":"Beta. 25 test unitari, 11 test strumentati su emulatore Android e uno smoke test della build release minificata girano in CI; non ancora provato su un telefono fisico. Le traduzioni sono automatiche e non riviste da madrelingua. Le versioni dalla 0.4.0 condividono la chiave di firma: gli aggiornamenti si installano sopra (da 0.3.0 o precedenti, disinstalla una volta).","ver":"Versione","upd":"Ultimo aggiornamento","demo_title":"Guardalo in azione","demo_note":"Screenshot e registrazioni reali di LUSTRUM su un emulatore Android con file di esempio generati — non su un telefono fisico.","demo_shots":["Home: spazio a colpo d'occhio e scansione con un tocco","File inutili trovati, pronti da controllare","File identici, una copia tenuta per gruppo","Foto simili: si tiene la copia più nitida","Swiper: scorri per tenere o eliminare, nulla viene rimosso senza conferma","Pulizia programmata, eliminazione sicura e riduzione della cache"],"demo_vids":["Scansione del telefono","Ricerca dei duplicati","Swiper in azione","Programmare la pulizia automatica"],"demo_vtitle":"Brevi video dimostrativi"},"es":{"name":"Español","title":"LUSTRUM — Limpiador de almacenamiento para Android. Sin anuncios. Sin internet.","meta":"LUSTRUM encuentra archivos basura, duplicados, fotos parecidas y restos de apps en tu teléfono Android. Código abierto, sin anuncios y sin posibilidad de conectarse a internet.","badge":"Código abierto · Sin anuncios · Sin conexión por diseño","h1a":"Recupera tu teléfono.","h1b":"Nada sale de él.","sub":"LUSTRUM encuentra archivos basura, duplicados, fotos parecidas y restos de aplicaciones, y los elimina solo con tu permiso. No tiene el permiso INTERNET, así que no puede enviar nada a ningún sitio.","cta1":"Descargar APK","cta2":"Código fuente","stats":["anuncios","permiso INTERNET","rastreadores","idiomas"],"nav":["Funciones","Demo","Comparación","Privacidad","Descargar"],"f_title":"Qué hace","features":[["El almacenamiento de un vistazo","Espacio usado y libre, desglosado en imágenes, vídeo, audio, documentos y archivos comprimidos."],["Archivos grandes, antiguos y basura","Archivos de más de 50 MB, sin tocar desde hace un año, temporales, miniaturas, papelera y descargas interrumpidas."],["Duplicados exactos","Comparados por tamaño, luego huella rápida y después SHA-256 completo. Por defecto se conserva la copia más antigua."],["Fotos parecidas","El hash perceptual encuentra fotos redimensionadas, guardadas de nuevo o repetidas, agrupadas sin encadenar. Revisas cada grupo; por defecto se conserva la copia más grande."],["Restos de aplicaciones","Carpetas que dejaron apps desinstaladas hace tiempo, y carpetas vacías."],["Compresión de fotos","Recodifica los JPEG grandes y los sustituye solo si el resultado pesa al menos un 20 % menos. Se conserva el EXIF; las Motion Photos y las fotos HDR se omiten."],["Apps, cachés y sin uso","Tamaño de la caché por app, fecha del último uso y acceso directo a sus ajustes o a la desinstalación."],["Estado del dispositivo","RAM, nivel y temperatura de la batería — solo lectura, a título informativo."],["Fotos borrosas y oscuras","Mide nitidez y brillo en una copia pequeña de cada foto y lista los probables descartes para que los revises."],["Eliminación segura con deshacer","Papelera LUSTRUM opcional: los archivos eliminados esperan 30 días y se pueden restaurar; el espacio se libera al vaciarla."],["Vistas previas y carpetas más grandes","Miniaturas en cada lista, un ranking de las carpetas que más ocupan y el total liberado hasta ahora."],["Swiper","Repasa fotos y vídeos uno a uno, empezando por los más antiguos: desliza a la izquierda para eliminar, a la derecha para conservar. No se quita nada hasta que confirmes al final."],["Limpieza programada","Semanal o mensual, en segundo plano, con batería suficiente: una notificación, o limpieza automática solo de la basura evidente de más de 24 horas. Los archivos limpiados van siempre primero a la papelera LUSTRUM de 30 días."],["Mejor foto y vídeos parecidos","En cada grupo de fotos parecidas se propone primero la copia más nítida. Los vídeos parecidos se detectan por un fotograma central y una duración casi idéntica."],["Reducción de caché asistida por el sistema","Pide a Android que libere la caché de otras apps solicitando espacio. El resultado varía según el dispositivo; sin magia de root. En teléfonos con root también usa root para vaciar todas las cachés."]],"p_title":"Privado por diseño","p_text":"La mayoría de los limpiadores viven de anuncios y datos. LUSTRUM está hecho al revés.","points":["Sin permiso INTERNET en el manifiesto — puedes comprobarlo en la información de la app del sistema.","Sin cuentas, analíticas, anuncios ni avisos de pago.","Cada borrado se confirma; en los archivos multimedia lo hace el cuadro de diálogo del propio Android.","Comprobaciones de seguridad integradas: las Motion Photos y las fotos HDR nunca se recomprimen, los archivos modificados en las últimas 24 horas nunca se consideran basura y no se puede borrar nada fuera del almacenamiento compartido.","La limpieza programada actúa solo sobre basura evidente de más de 24 horas y la mueve siempre primero a la papelera LUSTRUM, nunca directa a la eliminación."],"c_title":"Cómo se compara","c_sub":"Frente a los limpiadores más conocidos, según sus descripciones públicas (noviembre de 2026). Las celdas de la competencia proceden de descripciones públicas y no las hemos probado. La compresión de LUSTRUM (solo JPEG) y la programación (solo basura evidente) son parciales; herramientas maduras como SD Maid SE hacen más.","rows":["Sin anuncios","Sin acceso a internet ni telemetría","Código abierto","Duplicados y fotos parecidas","Restos de apps desinstaladas","Compresión de fotos","Limpieza programada","«Boost de RAM»","Soporte root / Shizuku"],"legend":"✓ sí · ~ parcial o de pago · ✗ no · — no lo ofrece, a propósito","sr":["sí","parcial o de pago","no","no lo ofrece"],"n_title":"Lo que no hace — a propósito","n_items":["El «boost de RAM» y los cierra-apps en segundo plano. Android gestiona la memoria por sí solo; esos botones no ayudan y gastan batería.","Vaciar con garantía, con un toque, la caché de otras apps. Android lo prohíbe sin privilegios especiales; LUSTRUM ofrece una reducción asistida por el sistema (resultados variables) y enlaza a la pantalla de almacenamiento de cada app.","iOS. El sistema no permite limpiar fuera del espacio propio de la app.","Automatización agresiva en segundo plano. La limpieza programada solo toca basura evidente de más de 24 horas, nunca tus fotos ni documentos.","Mirar dentro de las carpetas Android/data de otras apps. Android 11+ lo bloquea a toda app normal; solo root o Shizuku pueden. LUSTRUM usa root solo para reducir la caché y no admite Shizuku."],"d_title":"Consigue LUSTRUM","d_sub":"Beta — versión 0.8.0. Se instala directamente, sin cuenta de tienda.","steps":["Descarga el APK de la última versión publicada.","Permite la instalación desde esta fuente cuando Android te lo pida.","Abre LUSTRUM, concede el acceso a multimedia y pulsa Escanear. Un acceso adicional opcional desbloquea documentos, restos y compresión."],"d_btn":"Descargar APK","perm_title":"Los permisos, en cristiano","perm_cols":["Permiso","Para qué"],"perms":[["Multimedia","Escanea fotos, vídeo y audio. Para borrar, Android pide confirmación."],["Acceso a todos los archivos (opcional)","Documentos, basura, restos, carpetas vacías y compresión."],["Acceso al uso de aplicaciones (opcional)","Tamaño de la caché por app y cuándo se usó por última vez."],["Eliminación de paquetes","Permite desinstalar una app desde la lista."]],"lic":"Publicado bajo licencia MIT.","share":"Compartir","a11y":["Accesibilidad","Alto contraste","Fuente legible","Más espaciado","Reducir animaciones","Subrayar enlaces","Restablecer","Cerrar"],"scroll":"Volver arriba","zoom":["Acercar","Alejar","Ajustar a la pantalla"],"mock":["Usado","libre","Se puede liberar","liberados"],"cats":["Imágenes","Vídeo","Audio","Documentos","Comprimidos"],"support":["Apoya el proyecto","Invítame a un café"],"build_title":"Compilación","build_text":"JDK 21, SDK de Android, Gradle 8.14+: ejecuta `gradle assembleRelease` (`gradle testDebugUnitTest` ejecuta las pruebas unitarias). El APK aparece en `app/build/outputs/apk/release/`. El flujo Build APK prueba, compila y publica una versión por cada versión nueva en main. Los APK se firman con una clave pública estable del repositorio (`tools/lustrum-public.jks`), así las actualizaciones se instalan encima; para tu propia distribución añade tu clave como secretos del repositorio (`LUSTRUM_KEYSTORE_B64`, `LUSTRUM_STORE_PASS`, `LUSTRUM_KEY_PASS`, `LUSTRUM_KEY_ALIAS`).","status_title":"Estado","status_text":"Beta. 25 pruebas unitarias, 11 instrumentadas en un emulador Android y una prueba de humo de la versión release minificada se ejecutan en CI; aún no probado en un teléfono físico. Las traducciones son automáticas y no están revisadas por nativos. Las versiones desde 0.4.0 comparten clave de firma: las actualizaciones se instalan encima (desde 0.3.0 o anteriores, desinstala una vez).","ver":"Versión","upd":"Última actualización","demo_title":"Míralo en acción","demo_note":"Capturas y grabaciones reales de LUSTRUM en un emulador Android con archivos de ejemplo generados — no en un teléfono físico.","demo_shots":["Inicio: el almacenamiento de un vistazo y un escaneo con un toque","Basura encontrada, lista para revisar","Archivos idénticos, una copia conservada por grupo","Fotos parecidas: se conserva la copia más nítida","Swiper: desliza para conservar o eliminar, nada se quita sin confirmar","Limpieza programada, eliminación segura y reducción de caché"],"demo_vids":["Escaneo del teléfono","Búsqueda de duplicados","Swiper en acción","Programar la limpieza automática"],"demo_vtitle":"Vídeos de demostración cortos"},"pt":{"name":"Português","title":"LUSTRUM — Limpador de armazenamento para Android. Sem anúncios. Sem internet.","meta":"O LUSTRUM encontra arquivos inúteis, duplicatas, fotos parecidas e sobras de aplicativos no seu celular Android. Código aberto, sem anúncios e sem capacidade de se conectar à internet.","badge":"Código aberto · Sem anúncios · Offline por projeto","h1a":"Recupere seu celular.","h1b":"Nada sai dele.","sub":"O LUSTRUM encontra arquivos inúteis, duplicatas, fotos parecidas e sobras de aplicativos, e só os apaga com a sua autorização. Ele não tem a permissão INTERNET, então não consegue enviar nada para lugar nenhum.","cta1":"Baixar APK","cta2":"Código-fonte","stats":["anúncios","permissão INTERNET","rastreadores","idiomas"],"nav":["Funções","Demo","Comparação","Privacidade","Baixar"],"f_title":"O que faz","features":[["Armazenamento num relance","Espaço usado e livre, dividido em imagens, vídeo, áudio, documentos e arquivos compactados."],["Arquivos grandes, antigos e inúteis","Arquivos acima de 50 MB, parados há um ano, temporários, miniaturas, lixeira e downloads interrompidos."],["Duplicatas exatas","Comparadas por tamanho, depois impressão rápida e depois SHA-256 completo. Por padrão, a cópia mais antiga é mantida."],["Fotos parecidas","O hash perceptual encontra fotos redimensionadas, salvas de novo ou repetidas, agrupadas sem encadeamento. Você revisa cada grupo; por padrão a maior cópia é mantida."],["Sobras de aplicativos","Pastas deixadas por aplicativos desinstalados há muito tempo, além de pastas vazias."],["Compressão de fotos","Recodifica JPEGs grandes e só os substitui se o resultado for pelo menos 20% menor. O EXIF é mantido; Motion Photos e fotos HDR são ignoradas."],["Apps, caches e sem uso","Tamanho do cache por app, data do último uso e acesso direto às configurações ou à desinstalação."],["Estado do dispositivo","RAM, nível e temperatura da bateria — somente leitura, apenas informativo."],["Fotos tremidas e escuras","Mede nitidez e brilho em uma cópia pequena de cada foto e lista os prováveis descartes para você revisar."],["Exclusão segura com desfazer","Lixeira LUSTRUM opcional: os arquivos excluídos esperam 30 dias e podem ser restaurados; o espaço é liberado ao esvaziá-la."],["Prévias e maiores pastas","Miniaturas em cada lista, um ranking das pastas que mais ocupam espaço e o total liberado até agora."],["Swiper","Revise fotos e vídeos um a um, começando pelos mais antigos: deslize para a esquerda para excluir, para a direita para manter. Nada é removido até você confirmar no final."],["Limpeza agendada","Semanal ou mensal, em segundo plano, com bateria suficiente: uma notificação, ou limpeza automática apenas do lixo óbvio com mais de 24 horas. Os arquivos limpos vão sempre primeiro para a lixeira LUSTRUM de 30 dias."],["Melhor foto e vídeos parecidos","Em cada grupo de fotos parecidas, a cópia mais nítida é sugerida primeiro. Vídeos parecidos são identificados por um quadro do meio e duração quase idêntica."],["Redução de cache assistida pelo sistema","Pede ao Android que libere o cache de outros apps solicitando espaço. O resultado varia conforme o aparelho; sem mágica de root. Em telefones com root também usa root para limpar todos os caches."]],"p_title":"Privado por construção","p_text":"A maioria dos limpadores vive de anúncios e dados. O LUSTRUM foi feito ao contrário.","points":["Sem a permissão INTERNET no manifesto — você confere nas informações do app no sistema.","Sem contas, análises, anúncios ou pedidos de pagamento.","Toda exclusão é confirmada; nas mídias, quem confirma é a caixa de diálogo do próprio Android.","Verificações de segurança integradas: Motion Photos e fotos HDR nunca são recomprimidas, arquivos alterados nas últimas 24 horas nunca são tratados como lixo e nada fora do armazenamento compartilhado pode ser excluído.","A limpeza agendada atua só sobre lixo óbvio com mais de 24 horas e o move sempre primeiro para a lixeira LUSTRUM, nunca direto para a exclusão."],"c_title":"Como se compara","c_sub":"Com os limpadores mais conhecidos, com base nas descrições públicas deles (novembro de 2026). As células dos concorrentes vêm de descrições públicas e não foram testadas por nós. A compressão do LUSTRUM (só JPEG) e o agendamento (só lixo óbvio) são parciais; ferramentas maduras como o SD Maid SE fazem mais.","rows":["Sem anúncios","Sem acesso à internet nem telemetria","Código aberto","Duplicatas e fotos parecidas","Sobras de apps desinstalados","Compressão de fotos","Limpeza agendada","“Turbo de RAM”","Suporte a root / Shizuku"],"legend":"✓ sim · ~ parcial ou pago · ✗ não · — não oferece, de propósito","sr":["sim","parcial ou pago","não","não oferece"],"n_title":"O que ele não faz — de propósito","n_items":["“Turbo de RAM” e fechadores de apps em segundo plano. O Android gerencia a memória sozinho; esses botões não ajudam e gastam bateria.","Limpar com garantia, em um toque, o cache de outros apps. O Android proíbe sem privilégios especiais; o LUSTRUM oferece uma redução assistida pelo sistema (resultados variáveis) e leva à tela de armazenamento de cada app.","iOS. O sistema não permite limpeza fora do espaço do próprio app.","Automação agressiva em segundo plano. A limpeza agendada só toca em lixo óbvio com mais de 24 horas, nunca em suas fotos ou documentos.","Olhar dentro das pastas Android/data de outros apps. O Android 11+ bloqueia isso para qualquer app comum; só root ou Shizuku conseguem. O LUSTRUM usa root apenas para reduzir o cache e não suporta Shizuku."],"d_title":"Baixe o LUSTRUM","d_sub":"Beta — versão 0.8.0. Instalação direta, sem conta de loja.","steps":["Baixe o APK na última versão publicada.","Permita a instalação desta fonte quando o Android perguntar.","Abra o LUSTRUM, conceda acesso às mídias e toque em Verificar. Um acesso extra opcional libera documentos, sobras e compressão."],"d_btn":"Baixar APK","perm_title":"As permissões, em palavras simples","perm_cols":["Permissão","Para quê"],"perms":[["Mídia","Verifica fotos, vídeo e áudio. Para apagar, o Android pede confirmação."],["Acesso a todos os arquivos (opcional)","Documentos, lixo, sobras, pastas vazias e compressão."],["Acesso ao uso de apps (opcional)","Tamanho do cache por app e quando foi usado pela última vez."],["Remoção de pacotes","Permite desinstalar um app pela lista."]],"lic":"Publicado sob a licença MIT.","share":"Compartilhar","a11y":["Acessibilidade","Alto contraste","Fonte legível","Mais espaçamento","Reduzir animações","Sublinhar links","Redefinir","Fechar"],"scroll":"Voltar ao topo","zoom":["Ampliar","Reduzir","Ajustar à tela"],"mock":["Usado","livre","Pode ser liberado","liberados"],"cats":["Imagens","Vídeo","Áudio","Documentos","Compactados"],"support":["Apoie o projeto","Me pague um café"],"build_title":"Compilação","build_text":"JDK 21, Android SDK, Gradle 8.14+: execute `gradle assembleRelease` (`gradle testDebugUnitTest` roda os testes unitários). O APK aparece em `app/build/outputs/apk/release/`. O workflow Build APK testa, compila e publica uma versão a cada nova versão enviada para main. Os APKs são assinados com uma chave pública estável do repositório (`tools/lustrum-public.jks`), então as atualizações se instalam por cima; para sua própria distribuição, adicione sua chave como segredos do repositório (`LUSTRUM_KEYSTORE_B64`, `LUSTRUM_STORE_PASS`, `LUSTRUM_KEY_PASS`, `LUSTRUM_KEY_ALIAS`).","status_title":"Situação","status_text":"Beta. 25 testes unitários, 11 instrumentados em um emulador Android e um teste de fumaça da versão release minificada rodam no CI; ainda não testado em um telefone físico. As traduções são automáticas e não revisadas por nativos. As versões desde 0.4.0 compartilham a chave de assinatura: as atualizações instalam por cima (de 0.3.0 ou anteriores, desinstale uma vez).","ver":"Versão","upd":"Última atualização","demo_title":"Veja em ação","demo_note":"Capturas e gravações reais do LUSTRUM em um emulador Android com arquivos de exemplo gerados — não em um telefone físico.","demo_shots":["Início: o armazenamento num relance e uma verificação com um toque","Lixo encontrado, pronto para revisar","Arquivos idênticos, uma cópia mantida por grupo","Fotos parecidas: a cópia mais nítida é mantida","Swiper: deslize para manter ou excluir, nada é removido sem confirmar","Limpeza agendada, exclusão segura e redução de cache"],"demo_vids":["Verificando o telefone","Procurando duplicatas","Swiper em ação","Agendando a limpeza automática"],"demo_vtitle":"Vídeos de demonstração curtos"},"de":{"name":"Deutsch","title":"LUSTRUM — Speicherbereiniger für Android. Werbefrei. Ohne Internet.","meta":"LUSTRUM findet Datenmüll, Duplikate, ähnliche Fotos und App-Reste auf Ihrem Android-Handy. Open Source, werbefrei und ohne die Möglichkeit, online zu gehen.","badge":"Open Source · Werbefrei · Offline per Design","h1a":"Holen Sie sich Ihr Handy zurück.","h1b":"Nichts verlässt es.","sub":"LUSTRUM findet Datenmüll, Duplikate, ähnliche Fotos und App-Reste und löscht sie nur mit Ihrer Zustimmung. Es hat keine INTERNET-Berechtigung und kann daher nichts irgendwohin senden.","cta1":"APK herunterladen","cta2":"Quellcode","stats":["Werbung","INTERNET-Berechtigung","Tracker","Sprachen"],"nav":["Funktionen","Demo","Vergleich","Datenschutz","Download"],"f_title":"Was es kann","features":[["Speicher auf einen Blick","Belegter und freier Platz, aufgeteilt in Bilder, Videos, Audio, Dokumente und Archive."],["Große, alte und überflüssige Dateien","Dateien über 50 MB, seit einem Jahr unberührt, temporäre Dateien, Vorschaubilder, Papierkorb und abgebrochene Downloads."],["Exakte Duplikate","Verglichen nach Größe, dann schnellem Fingerabdruck, dann vollständigem SHA-256. Standardmäßig bleibt die älteste Kopie."],["Ähnliche Fotos","Wahrnehmungs-Hashing findet verkleinerte, neu gespeicherte und wiederholte Aufnahmen, ohne Kettenbildung gruppiert. Sie prüfen jede Gruppe; standardmäßig bleibt die größte Kopie erhalten."],["App-Reste","Ordner, die längst deinstallierte Apps hinterlassen haben, sowie leere Ordner."],["Foto-Komprimierung","Kodiert große JPEGs neu und ersetzt sie nur, wenn das Ergebnis mindestens 20 % kleiner ist. EXIF bleibt erhalten; Motion Photos und HDR-Aufnahmen werden übersprungen."],["Apps, Caches und Ungenutztes","Cache-Größe pro App, Datum der letzten Nutzung, direkt zu den Einstellungen oder zur Deinstallation."],["Gerätestatus","RAM, Akkustand und Temperatur — nur lesend, zur Information."],["Unscharfe & dunkle Fotos","Misst Schärfe und Helligkeit an einer kleinen Kopie jedes Fotos und listet wahrscheinlichen Ausschuss zur Prüfung auf."],["Sicheres Löschen mit Rückgängig","Optionaler LUSTRUM-Papierkorb: Gelöschtes wartet 30 Tage und lässt sich wiederherstellen; Speicher wird beim Leeren frei."],["Vorschauen & größte Ordner","Vorschaubilder in jeder Liste, eine Rangliste der speicherhungrigen Ordner und die bisher freigegebene Gesamtmenge."],["Swiper","Gehen Sie Fotos und Videos einzeln durch, die ältesten zuerst: nach links wischen zum Löschen, nach rechts zum Behalten. Nichts wird entfernt, bevor Sie am Ende bestätigen."],["Geplantes Aufräumen","Wöchentlich oder monatlich im Hintergrund, bei ausreichendem Akku: eine Benachrichtigung oder automatisches Bereinigen nur von offensichtlichem Datenmüll, der älter als 24 Stunden ist. Bereinigte Dateien landen immer zuerst im 30-Tage-Papierkorb von LUSTRUM."],["Bestes Foto & ähnliche Videos","In jeder Gruppe ähnlicher Fotos wird die schärfste Kopie zuerst vorgeschlagen. Ähnliche Videos werden an einem Bild aus der Mitte und fast gleicher Länge erkannt."],["Systemgestützte Cache-Verkleinerung","Bittet Android, den Cache anderer Apps durch Speicheranforderung zu leeren. Das Ergebnis hängt vom Gerät ab; keine Root-Magie. Auf gerooteten Telefonen nutzt es zusätzlich Root, um alle Caches zu leeren."]],"p_title":"Privat von Grund auf","p_text":"Die meisten Reiniger leben von Werbung und Daten. LUSTRUM ist umgekehrt gebaut.","points":["Keine INTERNET-Berechtigung im Manifest — prüfbar in den App-Infos des Systems.","Keine Konten, keine Analyse, keine Werbung, keine Kaufaufforderungen.","Jedes Löschen wird bestätigt; bei Mediendateien übernimmt das den Systemdialog von Android.","Eingebaute Sicherheitsprüfungen: Motion Photos und HDR-Fotos werden nie neu komprimiert, in den letzten 24 Stunden geänderte Dateien gelten nie als Datenmüll, und außerhalb des gemeinsamen Speichers lässt sich nichts löschen.","Das geplante Aufräumen betrifft nur offensichtlichen Datenmüll älter als 24 Stunden und verschiebt ihn immer zuerst in den LUSTRUM-Papierkorb, nie direkt in die Löschung."],"c_title":"Der Vergleich","c_sub":"Mit den bekanntesten Reinigern, nach deren öffentlichen Beschreibungen (November 2026). Die Felder der Mitbewerber stammen aus öffentlichen Beschreibungen und wurden von uns nicht getestet. Komprimierung (nur JPEG) und Zeitplan (nur offensichtlicher Datenmüll) sind bei LUSTRUM teilweise umgesetzt; ausgereifte Tools wie SD Maid SE leisten mehr.","rows":["Werbefrei","Kein Internetzugriff, keine Telemetrie","Open Source","Duplikate und ähnliche Fotos","Reste deinstallierter Apps","Foto-Komprimierung","Geplante Reinigung","„RAM-Boost“","Root-/Shizuku-Unterstützung"],"legend":"✓ ja · ~ teilweise oder kostenpflichtig · ✗ nein · — bewusst nicht vorhanden","sr":["ja","teilweise oder kostenpflichtig","nein","nicht vorhanden"],"n_title":"Was es bewusst nicht tut","n_items":["„RAM-Boost“ und das Beenden von Hintergrund-Apps. Android verwaltet den Speicher selbst; diese Schaltflächen helfen nicht und kosten Akku.","Garantiertes Ein-Tipp-Leeren der Caches anderer Apps. Android verbietet das ohne Sonderrechte; LUSTRUM bietet eine systemgestützte Verkleinerung (Ergebnis variiert) und verlinkt auf den Speicherbildschirm jeder App.","iOS. Das System erlaubt keine Bereinigung außerhalb des eigenen Bereichs einer App.","Aggressive Hintergrundautomatik. Das geplante Aufräumen berührt nur offensichtlichen Datenmüll älter als 24 Stunden, nie Ihre Fotos oder Dokumente.","In die Android/data-Ordner anderer Apps schauen. Android 11+ sperrt das für jede normale App; nur Root oder Shizuku können es. LUSTRUM nutzt Root nur für die Cache-Verkleinerung und unterstützt Shizuku nicht."],"d_title":"LUSTRUM holen","d_sub":"Beta — Version 0.8.0. Direkte Installation, ohne Store-Konto.","steps":["Laden Sie die APK aus der neuesten veröffentlichten Version herunter.","Erlauben Sie die Installation aus dieser Quelle, wenn Android fragt.","Öffnen Sie LUSTRUM, gewähren Sie Medienzugriff und tippen Sie auf Scannen. Optionaler Zusatzzugriff schaltet Dokumente, Reste und Komprimierung frei."],"d_btn":"APK herunterladen","perm_title":"Berechtigungen in einfachen Worten","perm_cols":["Berechtigung","Wofür"],"perms":[["Medien","Durchsucht Fotos, Videos und Audio. Zum Löschen fragt Android nach Bestätigung."],["Zugriff auf alle Dateien (optional)","Dokumente, Datenmüll, Reste, leere Ordner und Komprimierung."],["Nutzungszugriff (optional)","Cache-Größe pro App und letzte Nutzung."],["Paketentfernung","Erlaubt das Deinstallieren einer App aus der Liste."]],"lic":"Veröffentlicht unter der MIT-Lizenz.","share":"Teilen","a11y":["Barrierefreiheit","Hoher Kontrast","Gut lesbare Schrift","Mehr Abstand","Animationen reduzieren","Links unterstreichen","Zurücksetzen","Schließen"],"scroll":"Nach oben","zoom":["Vergrößern","Verkleinern","An Bildschirm anpassen"],"mock":["Belegt","frei","Kann freigegeben werden","freigegeben"],"cats":["Bilder","Videos","Audio","Dokumente","Archive"],"support":["Projekt unterstützen","Spendiere mir einen Kaffee"],"build_title":"Bauen","build_text":"JDK 21, Android SDK, Gradle 8.14+: `gradle assembleRelease` ausführen (`gradle testDebugUnitTest` startet die Unit-Tests). Die APK liegt in `app/build/outputs/apk/release/`. Der Workflow Build APK testet, baut und veröffentlicht für jede neue Version auf main ein Release. APKs werden mit einem stabilen öffentlichen Schlüssel aus dem Repository signiert (`tools/lustrum-public.jks`), Updates lassen sich also drüber installieren; für eigene Verteilung den eigenen Schlüssel als Repository-Secrets hinterlegen (`LUSTRUM_KEYSTORE_B64`, `LUSTRUM_STORE_PASS`, `LUSTRUM_KEY_PASS`, `LUSTRUM_KEY_ALIAS`).","status_title":"Stand","status_text":"Beta. 25 Unit-Tests, 11 instrumentierte Tests auf einem Android-Emulator und ein Smoke-Test des minifizierten Release-Builds laufen in der CI; noch nicht auf einem echten Telefon getestet. Die Übersetzungen sind maschinell und nicht von Muttersprachlern geprüft. Builds ab 0.4.0 teilen einen Signaturschlüssel, Updates werden also über die alte Version installiert (ab 0.3.0 oder früher einmal deinstallieren).","ver":"Version","upd":"Zuletzt aktualisiert","demo_title":"In Aktion sehen","demo_note":"Echte Screenshots und Bildschirmaufnahmen von LUSTRUM auf einem Android-Emulator mit erzeugten Beispieldateien — nicht auf einem echten Telefon.","demo_shots":["Start: Speicher auf einen Blick und Scan mit einem Tipp","Gefundener Datenmüll, bereit zur Prüfung","Identische Dateien, pro Gruppe bleibt eine Kopie","Ähnliche Fotos: die schärfste Kopie bleibt","Swiper: wischen zum Behalten oder Löschen, nichts wird ohne Bestätigung entfernt","Geplantes Aufräumen, sicheres Löschen und Cache-Verkleinerung"],"demo_vids":["Telefon scannen","Duplikate finden","Swiper in Aktion","Automatisches Aufräumen planen"],"demo_vtitle":"Kurze Demovideos"},"hu":{"name":"Magyar","title":"LUSTRUM — Android tárhelytisztító. Reklámmentes. Internet nélkül.","meta":"A LUSTRUM megtalálja a felesleges fájlokat, duplikátumokat, hasonló fotókat és az alkalmazások maradványait az Android-telefonodon. Nyílt forráskódú, reklámmentes, és nem tud az internetre csatlakozni.","badge":"Nyílt forráskód · Reklámmentes · Tervezetten offline","h1a":"Vedd vissza a telefonod.","h1b":"Semmi nem hagyja el.","sub":"A LUSTRUM megtalálja a felesleges fájlokat, duplikátumokat, hasonló fotókat és az alkalmazások maradványait, és csak a jóváhagyásoddal törli őket. Nincs INTERNET-engedélye, így fizikailag sem tud semmit sehová küldeni.","cta1":"APK letöltése","cta2":"Forráskód","stats":["reklám","INTERNET-engedély","nyomkövető","nyelv"],"nav":["Funkciók","Demó","Összehasonlítás","Adatvédelem","Letöltés"],"f_title":"Mit tud","features":[["Tárhely egy pillantásra","Használt és szabad hely, képekre, videókra, hangra, dokumentumokra és archívumokra bontva."],["Nagy, régi és felesleges fájlok","50 MB feletti, egy éve érintetlen, ideiglenes fájlok, bélyegképek, kuka és megszakadt letöltések."],["Pontos duplikátumok","Méret, majd gyors ujjlenyomat, majd teljes SHA-256 alapján. Alapértelmezés szerint a legrégebbi másolat marad."],["Hasonló fotók","Az észlelési hash megtalálja az átméretezett, újramentett és ismételt felvételeket, láncolás nélkül csoportosítva. Te nézed át a csoportokat; alapból a legnagyobb másolat marad meg."],["Alkalmazásmaradványok","Régen eltávolított alkalmazások hátrahagyott mappái, valamint az üres mappák."],["Fotótömörítés","Újrakódolja a nagy JPEG-eket, és csak akkor cseréli le őket, ha az eredmény legalább 20%-kal kisebb. Az EXIF megmarad; a mozgó fényképeket és a HDR-felvételeket kihagyja."],["Alkalmazások, gyorsítótárak, nem használtak","Alkalmazásonkénti gyorsítótár-méret, utolsó használat dátuma, közvetlen ugrás a beállításokhoz vagy az eltávolításhoz."],["Eszközállapot","RAM, akkumulátorszint és hőmérséklet — csak olvasható, tájékoztató jellegű."],["Elmosódott és sötét fotók","Minden fotó kis másolatán méri az élességet és a fényerőt, és listázza a valószínű selejtet, hogy átnézhesd."],["Biztonságos törlés visszavonással","Opcionális LUSTRUM-kuka: a törölt fájlok 30 napig várnak és visszaállíthatók; a hely ürítéskor szabadul fel."],["Előnézetek és legnagyobb mappák","Bélyegképek minden listában, rangsor a legtöbb helyet foglaló mappákról és az eddig felszabadított összeg."],["Swiper","Lapozz végig a fotókon és videókon egyesével, a legrégebbiekkel kezdve: balra húzva törlöd, jobbra húzva megtartod. A végső megerősítésig semmi nem törlődik."],["Ütemezett tisztítás","Hetente vagy havonta, a háttérben, megfelelő akkumulátorszintnél: értesítés, vagy csak a 24 óránál régebbi, egyértelműen felesleges fájlok automatikus törlése. A megtisztított fájlok mindig előbb a 30 napos LUSTRUM-kukába kerülnek."],["Legjobb fotó és hasonló videók","A hasonló fotók csoportjaiban a legélesebb másolatot javasolja először. A hasonló videókat egy középső képkocka és a közel azonos hossz alapján párosítja."],["Rendszer által segített gyorsítótár-csökkentés","Az Androidot kéri, hogy tárhely igénylésével szabadítsa fel más alkalmazások gyorsítótárát. Az eredmény eszközfüggő; root-varázslat nincs. Rootolt telefonokon rootot is használ az összes gyorsítótár törléséhez."]],"p_title":"Magánszféra-barát felépítés","p_text":"A legtöbb tisztító reklámokból és adatokból él. A LUSTRUM fordítva készült.","points":["Nincs INTERNET-engedély a jegyzékben — ellenőrizheted a rendszer alkalmazásinfóiban.","Nincs fiók, analitika, reklám vagy fizetési felszólítás.","Minden törlést megerősítesz; a médiafájloknál az Android saját párbeszédablaka kér jóváhagyást.","Beépített biztonsági ellenőrzések: a mozgó fényképeket (Motion Photo) és a HDR-fotókat soha nem tömöríti újra, a 24 órán belül módosított fájlokat soha nem tekinti feleslegesnek, és a megosztott tárhelyen kívül semmi nem törölhető.","Az ütemezett tisztítás csak a 24 óránál régebbi, egyértelműen felesleges fájlokat érinti, és mindig előbb a LUSTRUM-kukába helyezi, soha nem közvetlenül törli."],"c_title":"Összehasonlítás","c_sub":"A legismertebb tisztítókkal szemben, nyilvános leírásaik alapján (2026. november). A versenytársak adatai nyilvános leírásokból származnak, nem teszteltük őket. A LUSTRUM tömörítése (csak JPEG) és ütemezése (csak egyértelmű felesleges fájlok) részleges; az érett eszközök, például az SD Maid SE, többet tudnak.","rows":["Reklámmentes","Nincs internet-hozzáférés, nincs telemetria","Nyílt forráskód","Duplikátumok és hasonló fotók","Eltávolított alkalmazások maradványai","Fotótömörítés","Ütemezett tisztítás","„RAM-gyorsítás”","Root-/Shizuku-támogatás"],"legend":"✓ igen · ~ részben vagy fizetős · ✗ nem · — szándékosan nincs","sr":["igen","részben vagy fizetős","nem","nincs"],"n_title":"Amit szándékosan nem tesz","n_items":["„RAM-gyorsítás” és a háttérben futó alkalmazások leállítása. Az Android magától kezeli a memóriát; ezek a gombok nem segítenek, és merítik az akkumulátort.","Más alkalmazások gyorsítótárának garantált, egyérintéses törlése. Az Android különleges jogosultság nélkül tiltja; a LUSTRUM rendszer által segített csökkentést kínál (az eredmény változó), és az egyes alkalmazások tárhely-képernyőjére visz.","iOS. A rendszer nem engedi a tisztítást az alkalmazás saját területén kívül.","Agresszív háttérautomatika. Az ütemezett tisztítás csak a 24 óránál régebbi, egyértelműen felesleges fájlokat érinti, a fotóidat és dokumentumaidat soha.","Más alkalmazások Android/data mappáiba nézni. Az Android 11+ ezt minden átlagos alkalmazásnak tiltja; csak root vagy Shizuku képes rá. A LUSTRUM a rootot csak a gyorsítótár-csökkentéshez használja, a Shizukut nem támogatja."],"d_title":"Szerezd meg a LUSTRUM-ot","d_sub":"Béta — 0.8.0 verzió. Közvetlenül telepíthető, áruházi fiók nélkül.","steps":["Töltsd le az APK-t a legújabb kiadásból.","Engedélyezd a telepítést erről a forrásról, amikor az Android rákérdez.","Nyisd meg a LUSTRUM-ot, add meg a médiahozzáférést, és koppints a Keresésre. A választható extra hozzáférés feloldja a dokumentumokat, maradványokat és a tömörítést."],"d_btn":"APK letöltése","perm_title":"Az engedélyek, egyszerűen","perm_cols":["Engedély","Miért"],"perms":[["Média","Fotókat, videókat és hangfájlokat keres. Törléskor az Android megerősítést kér."],["Hozzáférés minden fájlhoz (választható)","Dokumentumok, felesleges fájlok, maradványok, üres mappák és tömörítés."],["Használati hozzáférés (választható)","Alkalmazásonkénti gyorsítótár-méret és az utolsó használat ideje."],["Csomag eltávolítása","Lehetővé teszi egy alkalmazás eltávolítását a listából."]],"lic":"MIT licenc alatt kiadva.","share":"Megosztás","a11y":["Akadálymentesítés","Magas kontraszt","Olvasható betűtípus","Nagyobb térköz","Animációk csökkentése","Hivatkozások aláhúzása","Visszaállítás","Bezárás"],"scroll":"Vissza a tetejére","zoom":["Nagyítás","Kicsinyítés","Képernyőhöz igazítás"],"mock":["Használt","szabad","Felszabadítható","felszabadítva"],"cats":["Képek","Videók","Hang","Dokumentumok","Archívumok"],"support":["Támogasd a projektet","Hívj meg egy kávéra"],"build_title":"Fordítás","build_text":"JDK 21, Android SDK, Gradle 8.14+: futtasd a `gradle assembleRelease` parancsot (a `gradle testDebugUnitTest` az egységteszteket futtatja). Az APK az `app/build/outputs/apk/release/` mappában jelenik meg. A Build APK munkafolyamat teszteli, lefordítja és kiadásként közzéteszi a main ágra érkező minden új verziót. Az APK-kat a tárolóban lévő stabil, nyilvános kulccsal írjuk alá (`tools/lustrum-public.jks`), így a frissítések a régi verzió fölé települnek; saját terjesztéshez add meg a saját kulcsodat tárolótitokként (`LUSTRUM_KEYSTORE_B64`, `LUSTRUM_STORE_PASS`, `LUSTRUM_KEY_PASS`, `LUSTRUM_KEY_ALIAS`).","status_title":"Állapot","status_text":"Béta. 25 egységteszt, 11 műszerezett teszt Android-emulátoron és a minifikált release build füsttesztje fut a CI-ben; fizikai telefonon még nem tesztelve. A fordítások gépiek, anyanyelvi beszélők nem ellenőrizték. A 0.4.0-tól kezdve a buildek közös aláírókulcsot használnak, így a frissítés a régire települ (0.3.0 vagy korábbi esetén egyszer távolítsd el).","ver":"Verzió","upd":"Utolsó frissítés","demo_title":"Működés közben","demo_note":"Valódi képernyőképek és felvételek a LUSTRUM-ról egy Android-emulátoron, generált mintafájlokkal — nem fizikai telefonon.","demo_shots":["Kezdőlap: a tárhely egy pillantásra és egyérintéses vizsgálat","Megtalált felesleges fájlok, átnézésre készen","Azonos fájlok, csoportonként egy példány marad","Hasonló fotók: a legélesebb másolat marad","Swiper: húzással megtartod vagy törlöd, megerősítés nélkül semmi nem törlődik","Ütemezett tisztítás, biztonságos törlés és gyorsítótár-csökkentés"],"demo_vids":["A telefon vizsgálata","Duplikátumok keresése","Swiper működés közben","Automatikus tisztítás ütemezése"],"demo_vtitle":"Rövid bemutatóvideók"}};

function buildShare(){
  const u = encodeURIComponent(SITE), tx = encodeURIComponent(t.title);
  const items = [
    ["X", "https://twitter.com/intent/tweet?url="+u+"&text="+tx],
    ["f", "https://www.facebook.com/sharer/sharer.php?u="+u],
    ["in", "https://www.linkedin.com/sharing/share-offsite/?url="+u],
    ["WA", "https://wa.me/?text="+tx+"%20"+u],
    ["TG", "https://t.me/share/url?url="+u+"&text="+tx],
    ["✉", "mailto:?subject="+tx+"&body="+u]
  ];
  const mk = () => {
    const f = document.createDocumentFragment();
    items.forEach(([l,h]) => { const a = el("a","rb sh",esc(l)); a.href = h; a.target = "_blank"; a.rel = "noopener noreferrer"; a.setAttribute("aria-label", t.share+": "+l); f.appendChild(a); });
    const c = el("button","rb sh","🔗"); c.type = "button"; c.setAttribute("aria-label", t.share+": link");
    c.onclick = () => { try { navigator.clipboard.writeText(SITE); c.textContent = "✓"; setTimeout(() => c.textContent = "🔗", 1400); } catch(e) {} };
    f.appendChild(c);
    return f;
  };
  $("#share-rail").replaceChildren(mk());
  const row = $("#share-row"); row.replaceChildren(el("span","",esc(t.share)+":"));
  row.appendChild(mk());
}

let io;
function observe(){
  const els = $$(".reveal");
  if (!("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:.12});
  els.forEach(e => io.observe(e));
}

let counted = false;
function runMock(){
  const reduce = document.documentElement.classList.contains("nm") || matchMedia("(prefers-reduced-motion:reduce)").matches;
  const ring = $("#ringv");
  const go = () => {
    ring.style.strokeDashoffset = String(352 * (1 - .72));
    $$("#mcats i").forEach(i => i.style.width = i.dataset.w + "%");
    const out = $("#cnt"), target = 4.2;
    if (reduce) { out.textContent = target.toFixed(1); return; }
    if (counted) { out.textContent = target.toFixed(1); return; }
    counted = true;
    const t0 = performance.now();
    const step = now => { const p = Math.min(1, (now - t0) / 2200); out.textContent = (target * (1 - Math.pow(1 - p, 3))).toFixed(1); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  };
  setTimeout(go, 350);
}

/* language selector */
const sel = $("#lang");
ORDER.forEach(c => { const o = el("option","",esc(T[c].name)); o.value = c; sel.appendChild(o); });
sel.onchange = () => render(sel.value);

/* accessibility + zoom, persisted */
const S = {z:1, hc:0, rf:0, sp:0, nm:0, ul:0};
try { Object.assign(S, JSON.parse(store.get("lustrum-a11y") || "{}")); } catch(e) {}
function applyA(){
  const r = document.documentElement;
  r.style.setProperty("--z", S.z);
  ["hc","rf","sp","nm","ul"].forEach(k => r.classList.toggle(k, !!S[k]));
  $$("#panel input[data-f]").forEach(i => i.checked = !!S[i.dataset.f]);
  store.set("lustrum-a11y", JSON.stringify(S));
}
$("#zin").onclick = () => { S.z = Math.min(1.6, +(S.z + .1).toFixed(2)); applyA(); };
$("#zout").onclick = () => { S.z = Math.max(.8, +(S.z - .1).toFixed(2)); applyA(); };
$("#zfit").onclick = () => { S.z = 1; applyA(); };
$$("#panel input[data-f]").forEach(i => i.onchange = () => { S[i.dataset.f] = i.checked ? 1 : 0; applyA(); });
$("#areset").onclick = () => { Object.assign(S, {z:1,hc:0,rf:0,sp:0,nm:0,ul:0}); applyA(); };
const panel = $("#panel"), aa = $("#aa");
function tp(on){ panel.classList.toggle("on", on); aa.setAttribute("aria-expanded", String(on)); }
aa.onclick = () => tp(!panel.classList.contains("on"));
$("#aclose").onclick = () => { tp(false); aa.focus(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") tp(false); });

/* scroll-up arrow */
addEventListener("scroll", () => $("#up").classList.toggle("on", scrollY > 500), {passive:true});

applyA();
const start = pick(); sel.value = start; render(start);
</script>
