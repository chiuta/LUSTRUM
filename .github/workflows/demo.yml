name: Demo media

# Capturi de ecran și videoclipuri reale, înregistrate pe un emulator Android cu fișiere de probă generate.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Tools (ffmpeg, Pillow)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Record demo on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: bash tools/demo.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-media
          path: media/
      - name: Commit media to the repository
        if: always()
        run: |
          rm -f media/last-ui.xml
          if ls media/*.png >/dev/null 2>&1; then
            git config user.name "Alexio"
            git config user.email "alexio@trom.tf"
            git add media
            if ! git diff --cached --quiet; then
              git commit -m "Demo media: capturi și videoclipuri înregistrate pe emulator"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
