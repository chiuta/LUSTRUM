name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses (SDK preinstalled on runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: lustrum-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release (version from build.gradle.kts)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/*.apk "lustrum-$VER.apk"
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" "lustrum-$VER.apk" --clobber
          else
            gh release create "v$VER" "lustrum-$VER.apk" --target "${{ github.sha }}" --title "LUSTRUM $VER (beta)" --generate-notes
          fi
