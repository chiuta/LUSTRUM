name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    # Traduceri complete, aceleași substituții în toate limbile, versiune coerentă, fișiere generate la zi.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node tools/check.mjs
      - run: |
          node tools/build-android.mjs
          LUSTRUM_DATE=$(grep -oP '\d{4}-\d{2}-\d{2}' README.md | head -1) node tools/build.mjs
          git diff --exit-code --stat || { echo "Fișierele generate nu sunt la zi: rulează node tools/build-android.mjs && node tools/build.mjs"; exit 1; }

  apk:
    needs: docs
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses (SDK preinstalled on runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build release APK
        env:
          LUSTRUM_KEYSTORE_B64: ${{ secrets.LUSTRUM_KEYSTORE_B64 }}
          LUSTRUM_STORE_PASS: ${{ secrets.LUSTRUM_STORE_PASS }}
          LUSTRUM_KEY_PASS: ${{ secrets.LUSTRUM_KEY_PASS }}
          LUSTRUM_KEY_ALIAS: ${{ secrets.LUSTRUM_KEY_ALIAS }}
        run: |
          if [ -n "$LUSTRUM_KEYSTORE_B64" ]; then
            echo "$LUSTRUM_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lustrum.jks"
            export LUSTRUM_KEYSTORE="$RUNNER_TEMP/lustrum.jks"
          else
            unset LUSTRUM_STORE_PASS LUSTRUM_KEY_PASS LUSTRUM_KEY_ALIAS
          fi
          gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: lustrum-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release (version from build.gradle.kts)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/*.apk "lustrum-$VER.apk"
          if gh release view "v$VER" >/dev/null 2>&1; then
            gh release upload "v$VER" "lustrum-$VER.apk" --clobber
          else
            gh release create "v$VER" "lustrum-$VER.apk" --target "${{ github.sha }}" --title "LUSTRUM $VER (beta)" --generate-notes
          fi

  emulator:
    # Teste pe un emulator Android real (API 34): scanare, duplicate, comprimare, coș, programare, interfață.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            gradle --no-daemon connectedDebugAndroidTest assembleRelease
            bash tools/smoke-release.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-reports
          path: app/build/reports/androidTests/
